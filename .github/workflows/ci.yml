name: CI

on:
  pull_request:
    branches: [dev]
  # Warms the shared Turbo cache. A cache written by a pull request is scoped to
  # refs/pull/<n>/merge and can only be restored by re-runs of that same pull
  # request; the only scope every PR can read is the base branch. With
  # pull_request as the sole trigger nothing ever wrote a current dev-scoped
  # entry, so every PR restored a stale one (the live entry dated from
  # 2026-07-28) and turbo reported 0 of 9 tasks cached.
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # GitHub-hosted. The self-hosted CI pool was retired on 2026-07-29; the only
    # self-hosted selector left in the repo is deploy.yml's [self-hosted, aliyun],
    # which is the production deploy runner. Standard runners are 2 vCPU / 8 GB
    # on private repos — see the "Report runner size" step below for the
    # measured values.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
          # These keys are own-first ON PURPOSE. Measured 2026-07-30; three of us
          # spent two days on it, so the answer lives here rather than in chat.
          #
          # 1. Matching is scope-outer / keys-inner. A run searches its OWN cache
          #    scope against every restore-key first, and returns on the first
          #    match there — it only falls through to the base-branch scope when
          #    NO key can match anything in its own scope.
          # 2. So once a PR has saved one entry, the broad `-turbo-CI-` prefix
          #    matches it and dev's entry is never consulted. That is inherent to
          #    the mechanism, not a misconfiguration.
          # 3. We keep it. An iterating PR's previous head is usually closer to
          #    its current head than dev is: measured `Cached: 8 of 9` between
          #    consecutive commits, versus `0 of 9` on a PR whose heads were
          #    large rewrites. The bad case costs one round and self-heals.
          # 4. Switching to dev-first requires deleting the broad prefix too.
          #    Removing only the per-ref prefix changes NOTHING — tried it in
          #    PR #1448, behaviour was identical, because the broad prefix still
          #    matched the PR's own entry.
          #
          # The exact `key` carries github.sha, so same-commit re-runs hit it
          # directly regardless of any of the above.
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.workflow }}-
            ${{ runner.os }}-turbo-

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'packages/core/**', 'packages/ui/**', 'packages/views/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      - name: Test self-host env derivation
        run: bash scripts/selfhost-config.test.sh

      - name: Enforce web-only workflow policy
        run: bash scripts/web-workflows.test.sh

      - name: Verify reserved-slugs.ts is up to date
        # Re-runs the generator and fails on any drift from the
        # checked-in TypeScript output. The Go side embeds the JSON
        # source directly, so a passing diff here proves both sides
        # share one source of truth.
        run: |
          pnpm generate:reserved-slugs
          git diff --exit-code -- packages/core/paths/reserved-slugs.ts

      - name: Fetch React Doctor base
        run: git fetch --no-tags origin dev:refs/remotes/origin/dev

      - name: React Doctor
        run: pnpm react:doctor

      - name: Build, type check, lint
        # Web-only (Frank 2026-07-28): drop desktop/docs/mobile from the PR
        # frontend job so CI stays on the product surface that still ships.
        # Dependents of @multica/web (core/ui/views) are included via the
        # `...` selector. Per-surface reasons below — deliberately not one
        # shared paragraph, so each exemption has to be justified on its own
        # rather than riding along on a blanket "web-only" note (task #12,
        # 2026-08-01):
        #
        # - apps/desktop packaging: out of the main release gate on purpose
        #   (#1320) — desktop isn't shipped through this pipeline.
        # - apps/desktop typecheck: no CI coverage, no assigned owner. Found
        #   broken by accident once (2026-08-01, honor-tab.tsx) — that
        #   incident is the reason this line exists instead of silence. If
        #   you touch apps/desktop, run its typecheck yourself; CI won't.
        # - apps/mobile: no one maintains it (Frank, 2026-08-01) — not in any
        #   CI gate, and not going to be. If it's red, nobody is watching
        #   and nobody will fix it. Known and unfixed as of this line: 3
        #   type errors in data/schemas.ts (Agent/RuntimeDevice zod schemas
        #   drifted from the current types, including one reference to the
        #   removed Agent.visibility field) — whoever picks mobile back up
        #   starts there, not from a clean slate.
        # - apps/docs: no CI coverage, no assigned owner, low blast radius
        #   (infrequent changes). If you touch apps/docs, run its typecheck
        #   yourself; CI won't.
        run: pnpm exec turbo build typecheck lint --filter='@multica/web...'

      # No Test step (Frank, 2026-08-06): the frontend unit suite was removed
      # wholesale — after cutting its cost ~35% (#2394/#2401, happy-dom +
      # threads) the job still could not reach the 10-minute wall target on
      # one runner without deleting most page coverage anyway. Frontend
      # correctness gates are build/typecheck/lint + React Doctor above.
      # The measured infrastructure and the reintroduction bar live in
      # docs/frontend-testing.md — read it before adding any test back.
  backend:
    # Also runs on the dev push. "The pull request already proved it" assumes no merge combination
    # can break tests both branches passed individually; #1457/#1459/#1455 hit
    # exactly that (2026-07-30): dev push had skipped backend since a day
    # earlier, so a bad merge sat undetected until an unrelated PR's CI hit it.
    # Backend is ~8 min and doesn't share a runner-scoped cache either way, so
    # running it here trades a small, bounded daily cost for same-day baseline
    # visibility instead of a silent, unbounded blind spot.
    # GitHub-hosted, same as frontend. Requires Docker for Postgres/Redis
    # service containers — see docs/ci-tencent-runner.md.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        # High host ports avoid colliding with Compose Postgres on self-hosted runners.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://multica:multica@localhost:55432/multica?sslmode=disable
      # Wires up the RedisLocalSkill*_test.go suite. Distinct from REDIS_URL
      # (which would flip the server binary itself onto the Redis-backed
      # realtime relay + request stores); the tests talk to this Redis
      # directly so they run alongside the Postgres-backed suite.
      REDIS_TEST_URL: redis://localhost:56379/1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: server/go.sum

      - name: Reject duplicate migration version numbers
        # Incremental only. `dev` already carries 59 duplicated numbers, and the
        # migrator records `version` as the full filename, so renaming an applied
        # migration would make production treat it as never run — existing
        # duplicates must stay. See scripts/migration-numbers.test.sh.
        #
        # The checkout above is shallow and has no origin/dev ref, so fetch it
        # here rather than assuming it exists.
        env:
          BASE_REF: origin/dev
        run: |
          git fetch --no-tags --depth=1 origin dev:refs/remotes/origin/dev
          bash scripts/migration-numbers.test.sh

      - name: Build
        run: cd server && go build ./...

      # task #85 P0: catch unkeyed composite literals that silently mis-assign
      # when models.go field order changes (the silent-shift class next to
      # hand-written SQL drift). composites is on by default in go vet.
      - name: Go vet (composites + default checks)
        run: cd server && go vet ./...

      - name: Cursor-deadlock check
        # Task #91: catches the #1803/#1812 shape (a rows cursor from
        # Query() left open while a nested call acquires a second pool
        # connection — deterministic pool deadlock under load). See
        # server/tools/cursordeadlock for the false-positive bar this was
        # held to before landing here.
        run: cd server && go run ./tools/cursordeadlock ./internal ./cmd ./pkg

      - name: Run migrations
        run: cd server && go run ./cmd/migrate up

      - name: Test
        # Integration packages share this job's Postgres service. Run packages
        # serially so a global scheduler repair cannot mutate another package's
        # temporary workspace while its fixture is still being assembled.
        run: cd server && go test -p 1 ./...

      # LRM-1076 AC1/AC5: re-run the silent-window integration test with -v so
      # unattended_auto_steps / probe / scheduler-event counts appear in the log
      # (plain `go test` without -v swallows test stdout even on PASS).
      - name: LRM-1076 silent-window evidence
        env:
          LRM_1076_EVIDENCE_PATH: ${{ runner.temp }}/lrm-1076-evidence.txt
        run: |
          cd server && go test -p 1 -count=1 -v \
            -run TestProcessResearchNextSteps_SilentWindowAutoStepsGe3 \
            ./internal/handler/
          test -s "$LRM_1076_EVIDENCE_PATH"
          echo "::group::LRM-1076 silent-window evidence"
          cat "$LRM_1076_EVIDENCE_PATH"
          echo "::endgroup::"
