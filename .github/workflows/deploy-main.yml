name: Deploy (main → 18090)

# Continuous deployment of the `main` branch to s89 (Tencent Cloud, Beijing)
# as a SECOND, fully isolated stack alongside the `dev` → :8090 deployment.
#
# Isolation model — "互不影响" (no interference) is the whole point:
#   - Separate Compose project name  -> multica-main   (containers multica-main-backend-1 …)
#   - Separate server directory      -> /data/multica-main  (own .env, own secrets)
#   - Separate Postgres volume       -> multica-main_pgdata (own DB + own migrations)
#   - Separate host ports            -> backend 18080 / frontend 13000 (public :18090 via Caddy)
#   - Separate concurrency group     -> deploy-s89-main (never blocks / is blocked by the dev deploy)
#
# The dev pipeline (.github/workflows/deploy.yml) is NOT touched. Both stacks
# share the same self-hosted runner on s89 and the same GHCR image registry; each
# deploy pins an exact `sha-<7>` image tag, so the shared mutable `:latest` tag
# can never cause the two environments to drift into each other.
#
# Trigger: fires ONLY when a PR is MERGED into `main` (github.event.pull_request.
# merged == true). Direct pushes to main do not deploy — which is exactly the
# "I manually merge the PR, then it deploys" flow. `main` is also branch-protected
# so only the owner can merge.
#
# Server-side one-time setup is documented in docs/deploy-s89-main.md.

on:
  pull_request:
    types: [closed]
    branches: [main]
    # Docs-only / markdown-only PRs change no code — skip the rebuild+restart.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to (re)deploy for rollback, e.g. sha-abc1234. Leave blank to build the current commit."
        required: false
        default: ""

# Independent from the dev deploy — the two stacks must never block each other.
concurrency:
  group: deploy-s89-main
  cancel-in-progress: false

jobs:
  build:
    # Build/deploy from the team org only. On a rollback dispatch with an
    # image_tag we skip building and redeploy that existing tag.
    if: >-
      github.repository_owner == 'LRM-Teams' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
      backend_image: ${{ steps.prep.outputs.backend_image }}
      web_image: ${{ steps.prep.outputs.web_image }}
    steps:
      # On a merged PR build the actual merge commit on `main`; on manual
      # dispatch build whatever ref was dispatched.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Compute image refs + tag
        id: prep
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          sha="$(git rev-parse --short=7 HEAD)"
          {
            echo "backend_image=ghcr.io/${owner_lc}/multica-backend"
            echo "web_image=ghcr.io/${owner_lc}/multica-web"
            echo "tag=sha-${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # s89 is x86_64, so amd64-only.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.prep.outputs.backend_image }}:latest
            ${{ steps.prep.outputs.backend_image }}:${{ steps.prep.outputs.tag }}
          build-args: |
            VERSION=${{ steps.prep.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=deploy-main-backend
          cache-to: type=gha,mode=max,scope=deploy-main-backend,ignore-error=true

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.prep.outputs.web_image }}:latest
            ${{ steps.prep.outputs.web_image }}:${{ steps.prep.outputs.tag }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ steps.prep.outputs.tag }}
          cache-from: type=gha,scope=deploy-main-web
          cache-to: type=gha,mode=max,scope=deploy-main-web,ignore-error=true

  deploy:
    needs: build
    # Bind the `s89` Environment so secrets.POSTGRES_PASSWORD is available.
    # (Optionally create a dedicated `s89-main` Environment to fully separate
    # rollback/approval gates — see docs/deploy-s89-main.md.)
    environment: s89
    # Run after a successful build, OR straight away on a rollback dispatch.
    if: >-
      always() &&
      github.repository_owner == 'LRM-Teams' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != ''))
    runs-on: [self-hosted, s89]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      # Fully isolated from the dev stack: own dir, own project name, own ports.
      DEV_ENV_FILE: /data/multica/.env
      DEPLOY_DIR: /data/multica-main
      COMPOSE_PROJECT: multica-main
      MAIN_BACKEND_PORT: "18080"
      MAIN_FRONTEND_PORT: "13000"
      IMAGE_TAG: >-
        ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '')
            && github.event.inputs.image_tag
            || needs.build.outputs.tag }}
    steps:
      # Pull only the compose file from the deployed commit, so the running
      # topology always matches the repo.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
          sparse-checkout: docker-compose.selfhost.yml
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull & restart the isolated main stack
        # POSTGRES_PASSWORD is the single source of truth for the DB password.
        # Because this stack has its OWN fresh postgres volume (multica-main_pgdata),
        # the first `up` initializes it with this password and the backend uses the
        # same — they always match. See docs/deploy-s89-main.md for first-run bringup.
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -f "${DEV_ENV_FILE}" ]; then
            echo "::error::${DEV_ENV_FILE} not found — cannot deep-copy dev env into the isolated main stack."
            exit 1
          fi
          if [ -z "${POSTGRES_PASSWORD:-}" ]; then
            echo "::error::POSTGRES_PASSWORD secret is empty — s89 Environment secret not wired. Aborting."
            exit 1
          fi
          mkdir -p "${DEPLOY_DIR}"
          if [ -w "${DEPLOY_DIR}" ]; then
            DEPLOY_ENV_FILE="${DEPLOY_DIR}/.env"
            tmp_env="$(mktemp "${DEPLOY_DIR}/.env.tmp.XXXXXX")"
            cp "${DEV_ENV_FILE}" "${tmp_env}"
            chmod 600 "${tmp_env}" || true
            mv "${tmp_env}" "${DEPLOY_ENV_FILE}"
            echo "Synced ${DEPLOY_ENV_FILE} from ${DEV_ENV_FILE} (separate copy, not a shared file)."
          else
            DEPLOY_ENV_FILE="${RUNNER_TEMP:-/tmp}/multica-main.env"
            cp "${DEV_ENV_FILE}" "${DEPLOY_ENV_FILE}"
            chmod 600 "${DEPLOY_ENV_FILE}" || true
            echo "Using runtime env copy ${DEPLOY_ENV_FILE} from ${DEV_ENV_FILE}; ${DEPLOY_DIR} is not writable."
          fi
          export DEPLOY_ENV_FILE

          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          export MULTICA_BACKEND_IMAGE="ghcr.io/${owner_lc}/multica-backend"
          export MULTICA_WEB_IMAGE="ghcr.io/${owner_lc}/multica-web"
          export MULTICA_IMAGE_TAG="${IMAGE_TAG}"
          PUBLIC_ORIGIN="http://82.157.184.89:18090"
          API_ORIGIN="${PUBLIC_ORIGIN}"
          # Keep the main stack config a deep copy of dev's .env, then overlay
          # only the values that must be unique for the independent :18090 stack.
          # These shell exports override --env-file for Compose interpolation
          # without mutating either /data/multica/.env or /data/multica-main/.env.
          export BACKEND_PORT="${MAIN_BACKEND_PORT}"
          export FRONTEND_PORT="${MAIN_FRONTEND_PORT}"
          export FRONTEND_ORIGIN="${PUBLIC_ORIGIN}"
          export MULTICA_APP_URL="${PUBLIC_ORIGIN}"
          export MULTICA_PUBLIC_URL="${API_ORIGIN}"
          export CORS_ALLOWED_ORIGINS="${PUBLIC_ORIGIN}"
          export COOKIE_DOMAIN=""
          export MULTICA_COOKIE_PREFIX="multica_main"
          export GOOGLE_REDIRECT_URI="${PUBLIC_ORIGIN}/auth/callback"

          echo "Deploying ${MULTICA_BACKEND_IMAGE}:${MULTICA_IMAGE_TAG} (+ web) as project '${COMPOSE_PROJECT}' on $(hostname)"
          echo "  backend host port : ${BACKEND_PORT}   (public :18090 via Caddy)"
          echo "  frontend host port: ${FRONTEND_PORT}"

          compose() {
            docker compose \
              -p "${COMPOSE_PROJECT}" \
              --project-directory "${DEPLOY_DIR}" \
              --env-file "${DEPLOY_ENV_FILE}" \
              -f "${GITHUB_WORKSPACE}/docker-compose.selfhost.yml" "$@"
          }

          # main is an independent stack. Bring postgres up first, then ensure
          # the DB named by the copied dev env exists even when the persistent
          # main pgdata volume was initialized earlier with a different DB name.
          compose pull
          compose up -d postgres
          compose exec -T postgres sh -lc '
            set -eu
            db="${POSTGRES_DB:-multica}"
            user="${POSTGRES_USER:-multica}"
            for i in $(seq 1 30); do
              if pg_isready -U "$user" -d postgres >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            if ! psql -U "$user" -d "$db" -tAc "SELECT 1" >/dev/null 2>&1; then
              echo "Creating missing database $db in isolated main postgres volume"
              createdb -U "$user" "$db"
            fi
          '
          # Start frontend before backend so Caddy can resolve the frontend DNS
          # name before backend health checks or proxy requests race container DNS.
          compose up -d frontend
          compose up -d backend
          # Prune unused images so the second stack doesn't fill the disk.
          docker image prune -af

      - name: Health check (/readyz)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${MAIN_BACKEND_PORT}/readyz" >/dev/null 2>&1; then
              echo "Backend (main) healthy after $((i * 2))s on :${MAIN_BACKEND_PORT}."
              exit 0
            fi
            echo "waiting for backend (main) readiness... ($i/30)"
            sleep 2
          done
          echo "::error::Backend (main) did not pass /readyz within 60s — deploy likely broken."
          docker logs --tail 80 "${COMPOSE_PROJECT}-backend-1" || true
          exit 1
