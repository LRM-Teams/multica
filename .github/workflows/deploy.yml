name: Deploy

# Continuous deployment to s89 (82.157.184.89, runner label `s89`). Images
# build on GitHub-hosted runners and push to GHCR; the self-hosted runner on
# s89 pulls images and restarts Compose locally.
#
# Test gate: the CI workflow runs on every PR into `dev`. The team's workflow is
# feature branch → PR → merge to `dev`, which builds images and deploys to s89.
# `main` is left as the upstream-tracking branch and never deploys via this
# workflow.
#
# Host layout: stack under `/data/multica`. GitHub Environment `s89` stores
# POSTGRES_PASSWORD and the optional voice key.

on:
  # Deploy only from the `dev` integration branch, after a PR has already been
  # merged. PR events must not deploy to the shared s89/dev environment; they
  # can build/test in CI, but s89 must always represent `dev` or an explicit
  # manual dispatch from `dev`. Rollback dispatches must name an existing image
  # tag.
  # Docs-only changes (#354 bug) are excluded — they don't change any code, so
  # triggering a backend rebuild/restart would disconnect all WS connections
  # for zero benefit.
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to (re)deploy for rollback, e.g. sha-abc1234. Leave blank to build the current commit."
        required: false
        default: ""

# Never run two deploys at once; never cancel an in-flight one mid-restart.
concurrency:
  group: deploy-s89
  cancel-in-progress: false

jobs:
  build:
    # Only build/deploy from the team fork — never upstream or other forks.
    # On manual dispatch with an image_tag we skip building and redeploy that tag.
    # Empty-tag manual builds must also target dev; this lane never builds a feature ref.
    if: >-
      github.repository_owner == 'LRM-Teams' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/dev' &&
        github.event.inputs.image_tag == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
      backend_image: ${{ steps.prep.outputs.backend_image }}
      web_image: ${{ steps.prep.outputs.web_image }}
      db_bridge_image: ${{ steps.prep.outputs.db_bridge_image }}
    steps:
      # On dev push or manual dev dispatch, build the committed dev head.
      - uses: actions/checkout@v4

      # GHCR paths must be lowercase, but github.repository_owner preserves the
      # org's display case (e.g. "LRM-Teams"). Lowercase it here. The tag is the
      # short SHA of the checked-out commit — the real dev commit being deployed.
      - name: Compute image refs + tag
        id: prep
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          sha="$(git rev-parse --short=7 HEAD)"
          {
            echo "backend_image=ghcr.io/${owner_lc}/multica-backend"
            echo "web_image=ghcr.io/${owner_lc}/multica-web"
            echo "db_bridge_image=ghcr.io/${owner_lc}/multica-db-bridge"
            echo "tag=sha-${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deploy host is x86_64, so amd64-only — no QEMU, no multi-arch manifest merge.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.prep.outputs.backend_image }}:latest
            ${{ steps.prep.outputs.backend_image }}:${{ steps.prep.outputs.tag }}
          build-args: |
            VERSION=${{ steps.prep.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=deploy-backend
          cache-to: type=gha,mode=max,scope=deploy-backend

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.prep.outputs.web_image }}:latest
            ${{ steps.prep.outputs.web_image }}:${{ steps.prep.outputs.tag }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ steps.prep.outputs.tag }}
          cache-from: type=gha,scope=deploy-web
          cache-to: type=gha,mode=max,scope=deploy-web

      - name: Build & push db-bridge
        # The multica-side bridge server image. Context is the db_bridge/
        # subproject (own pyproject + Dockerfile); file defaults to
        # db_bridge/Dockerfile. The Dockerfile's default CMD (run_stub --side
        # multica) is the multica-side gateway stub; the executor service
        # overrides it to run_executor --side multica at deploy time. (The
        # public run_multica server is no longer deployed - no external LLM
        # relay is needed.)
        uses: docker/build-push-action@v6
        with:
          context: db_bridge
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.prep.outputs.db_bridge_image }}:latest
            ${{ steps.prep.outputs.db_bridge_image }}:${{ steps.prep.outputs.tag }}
          cache-from: type=gha,scope=deploy-db-bridge
          cache-to: type=gha,mode=max,scope=deploy-db-bridge

  deploy:
    needs: build
    # Bind the `s89` Environment so `secrets.POSTGRES_PASSWORD` is available.
    # That secret is the single source of truth for the DB password; injecting
    # it here (see the Pull & restart step) stops the server's /data/multica/.env
    # from silently drifting out of sync with the Postgres role and crash-looping
    # the backend on every deploy.
    environment: s89
    # Run after a successful build (push / dispatch-without-tag), OR straight
    # away on a dev dispatch that names an existing tag to roll back to.
    if: >-
      always() &&
      github.repository_owner == 'LRM-Teams' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/dev' &&
        github.event.inputs.image_tag != ''))
    runs-on: [self-hosted, s89]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /data/multica
      # The tag to deploy: a rollback input if given, otherwise the freshly built one.
      IMAGE_TAG: >-
        ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '')
            && github.event.inputs.image_tag
            || needs.build.outputs.tag }}
    steps:
      # Pull only the compose file from the deployed commit, so the running
      # topology always matches the repo. Non-secret config comes from the
      # server's own /data/multica/.env (never in git); the DB password is
      # injected from the `s89` Environment secret below and overrides whatever
      # /data/multica/.env holds, so it can never drift.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.selfhost.yml
            docker-compose.s89.yml
            deploy/s89/Caddyfile
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull & restart backend + frontend + Caddy
        # POSTGRES_PASSWORD comes from the s89 Environment secret and is the
        # single source of truth for the DB password. Docker Compose gives shell
        # env vars precedence over --env-file, so this value overrides the one in
        # /data/multica/.env for the `${POSTGRES_PASSWORD}` interpolation the
        # compose file uses to build the backend's DATABASE_URL. GitHub masks the
        # secret in logs; never echo it. Keep the secret URL-safe — it is used
        # verbatim inside postgres://user:PASSWORD@host, which is not URL-encoded.
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Optional s89 Environment secret. Empty keeps voice endpoints
          # disabled; the value is passed directly to Compose and never echoed.
          DOUBAO_SPEECH_API_KEY: ${{ secrets.DOUBAO_SPEECH_API_KEY }}
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          export MULTICA_BACKEND_IMAGE="ghcr.io/${owner_lc}/multica-backend"
          export MULTICA_WEB_IMAGE="ghcr.io/${owner_lc}/multica-web"
          export MULTICA_DB_BRIDGE_IMAGE="ghcr.io/${owner_lc}/multica-db-bridge"
          export MULTICA_IMAGE_TAG="${IMAGE_TAG}"
          # s89/dev is the shared integration environment; keep this off by
          # default in docker-compose.selfhost.yml and opt in only for this lane.
          export MULTICA_DEV_AGENT_PROFILE_ACCESS=true
          if [ -z "${POSTGRES_PASSWORD:-}" ]; then
            echo "::error::POSTGRES_PASSWORD secret is empty — s89 Environment secret not wired. Aborting to avoid deploying with the wrong DB password."
            exit 1
          fi
          echo "Deploying ${MULTICA_BACKEND_IMAGE}:${MULTICA_IMAGE_TAG} (+ web) on $(hostname)"
          compose() {
            docker compose \
              --project-directory "${DEPLOY_DIR}" \
              --env-file "${DEPLOY_DIR}/.env" \
              -f "${GITHUB_WORKSPACE}/docker-compose.selfhost.yml" \
              -f "${GITHUB_WORKSPACE}/docker-compose.s89.yml" "$@"
          }
          # Validate the immutable checkout source before touching the runtime
          # file. A bad config must not be left behind for the next host restart.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/deploy/s89/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.3@sha256:ec18ee54aab3315c22e25f3b2babda73ff8007d39b13b3bd1bfffa2f0444c7d9 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # The runtime path is stable; the Actions checkout is ephemeral.
          # Install through a sibling file and rename it atomically.
          install -m 0644 "${GITHUB_WORKSPACE}/deploy/s89/Caddyfile" "${DEPLOY_DIR}/Caddyfile.next"
          mv -f "${DEPLOY_DIR}/Caddyfile.next" "${DEPLOY_DIR}/Caddyfile"
          # The backend container runs `migrate up` on start (entrypoint.sh).
          compose pull frontend backend
          # Start frontend before backend so Caddy can resolve the frontend DNS name
          # before the backend health check begins — avoids the container-restart
          # DNS race that caused intermittent 'no such host' errors (#324).
          compose up -d frontend
          compose up -d backend
          # Adopt the one legacy proxy container created before Caddy became a
          # Compose service. Resolve both its exact name and ownership label
          # before removal; certificate/config volumes are preserved.
          if docker container inspect multica-caddy >/dev/null 2>&1; then
            caddy_service="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' multica-caddy 2>/dev/null || true)"
            if [ "${caddy_service}" != "caddy" ]; then
              docker rm -f multica-caddy
            fi
          fi
          # The Caddyfile is a single-file bind mount. Atomic rename changes its
          # inode, so recreate only Caddy to remount the new file; reload alone
          # would keep reading the old inode.
          compose up -d --no-deps --force-recreate caddy
          # db-bridge-stub-multica + db-bridge-executor-multica are profile-gated
          # in the compose file, so naming them explicitly is what starts them.
          # They share the multica-db-bridge image (the public run_multica server
          # was dropped - no external LLM relay is needed; only the internal stub
          # + executor remain). The pull is best-effort: a rollback dispatch that
          # names a tag predating the db-bridge image must NOT abort the
          # backend/frontend roll, so warn and leave any existing containers
          # running.
          if compose pull db-bridge-stub-multica db-bridge-executor-multica; then
            # Gateway stub for multica -> AReaL RL calls (start_session /
            # set_reward / close_segment / chat_completions); run_stub --side
            # multica. Best-effort: a stub failure must not roll back the
            # backend/frontend that already succeeded - warn and leave any
            # existing stub container running.
            compose up -d db-bridge-stub-multica || echo "::warning::db-bridge-stub-multica failed to start; multica -> AReaL RL calls will fail until it runs."
            # Executor for areal -> multica env-dispatch / DAG fetch;
            # run_executor --side multica. Best-effort, same as above.
            compose up -d db-bridge-executor-multica || echo "::warning::db-bridge-executor-multica failed to start; areal -> multica DAG fetch will not be drained."
          else
            echo "::warning::db-bridge image not found at tag ${MULTICA_IMAGE_TAG}; skipping bridge roll (existing containers, if any, keep running). Use a tag built with the db-bridge CD change for a full bridge rollback."
          fi
          # Prune unused Docker images to prevent disk from filling up (#327).
          docker image prune -af

      - name: Verify app containers + Caddy HTTP and HTTPS proxies
        run: |
          set -euo pipefail

          compose() {
            docker compose \
              --project-directory "${DEPLOY_DIR}" \
              --env-file "${DEPLOY_DIR}/.env" \
              -f "${GITHUB_WORKSPACE}/docker-compose.selfhost.yml" \
              -f "${GITHUB_WORKSPACE}/docker-compose.s89.yml" "$@"
          }

          # Caddy reaches both app services only through their Docker service
          # names. These probes therefore validate the running container,
          # Compose DNS, Caddy upstream routing, and the externally served dev
          # listeners as one boundary. The HTTPS probe connects to loopback
          # while retaining the public IP as the certificate identity, avoiding
          # dependence on provider NAT hairpin behavior.
          for i in $(seq 1 45); do
            frontend_id="$(compose ps -q frontend)"
            backend_id="$(compose ps -q backend)"
            caddy_id="$(compose ps -q caddy)"
            frontend_status="$(docker inspect --format '{{.State.Status}}' "$frontend_id" 2>/dev/null || true)"
            frontend_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$frontend_id" 2>/dev/null || true)"
            backend_status="$(docker inspect --format '{{.State.Status}}' "$backend_id" 2>/dev/null || true)"
            caddy_status="$(docker inspect --format '{{.State.Status}}' "$caddy_id" 2>/dev/null || true)"
            if [ "$frontend_status" = running ] && [ "$frontend_health" = healthy ] && [ "$backend_status" = running ] && [ "$caddy_status" = running ] && \
              curl -fsS --max-time 5 http://127.0.0.1:8090/ >/dev/null 2>&1 && \
              curl -fsS --max-time 5 http://127.0.0.1:8090/healthz >/dev/null 2>&1 && \
              curl -fsS --max-time 5 http://127.0.0.1:8090/health >/dev/null 2>&1 && \
              [ "$(curl -fsS -o /dev/null -w '%{redirect_url}' --max-time 5 -H 'Accept: text/html' http://127.0.0.1:8090/)" = "https://82.157.184.89/" ] && \
              curl --connect-to 82.157.184.89:443:127.0.0.1:443 -fsS --max-time 5 https://82.157.184.89/healthz >/dev/null 2>&1 && \
              curl --connect-to 82.157.184.89:443:127.0.0.1:443 -fsS --max-time 5 https://82.157.184.89/health >/dev/null 2>&1; then
              echo "Frontend, backend, Caddy HTTP, and trusted IP HTTPS healthy after $((i * 2))s."
              exit 0
            fi
            echo "waiting for frontend/backend/Caddy/HTTPS readiness... ($i/45) frontend=${frontend_status}/${frontend_health:-none} backend=${backend_status:-none} caddy=${caddy_status:-none}"
            sleep 2
          done
          echo "::error::frontend/backend/Caddy HTTP redirect + trusted IP HTTPS did not pass within 90s."
          compose ps frontend backend caddy || true
          docker logs --tail 100 multica-caddy || true
          docker logs --tail 80 multica-frontend-1 || true
          docker logs --tail 80 multica-backend-1 || true
          exit 1

      - name: Health check (/readyz)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              echo "Backend healthy after $((i * 2))s."
              exit 0
            fi
            echo "waiting for backend readiness... ($i/30)"
            sleep 2
          done
          echo "::error::Backend did not pass /readyz within 60s — deploy likely broken."
          docker logs --tail 80 multica-backend-1 || true
          exit 1

      - name: Health check (db-bridge-stub-multica /healthz)
        # The multica-side gateway stub (multica -> AReaL RL direction). It is
        # an auxiliary bridge service, so a stub health failure is surfaced as a
        # warning rather than failing the whole deploy (which would mark
        # backend/frontend rolls red for a service unrelated to them). Skipped
        # when no stub container is running.
        if: always()
        run: |
          set -uo pipefail
          if ! docker ps --format '{{.Names}}' | grep -q '^multica-db-bridge-stub-multica-1$'; then
            echo "db-bridge-stub-multica container not running - skipping /healthz check."
            exit 0
          fi
          set -a; . "${DEPLOY_DIR}/.env" 2>/dev/null || true; set +a
          port="${BRIDGE_GATEWAY_STUB_PORT:-9100}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null 2>&1; then
              echo "db-bridge-stub-multica healthy after $((i * 2))s."
              exit 0
            fi
            echo "waiting for db-bridge-stub-multica readiness... ($i/30)"
            sleep 2
          done
          echo "::warning::db-bridge-stub-multica did not pass /healthz within 60s - investigate the stub container."
          docker logs --tail 80 multica-db-bridge-stub-multica-1 || true

      - name: Health check (db-bridge-executor-multica)
        # The multica-side executor (areal -> multica env-dispatch / DAG
        # direction). It is a DB-polling worker with NO HTTP listener, so the
        # check confirms the container is running and logged "executor ready"
        # rather than curling a port. Warning-not-error, like the other bridge
        # services. Skipped when no container is running.
        if: always()
        run: |
          set -uo pipefail
          name='multica-db-bridge-executor-multica-1'
          if ! docker ps --format '{{.Names}}' | grep -q "^${name}$"; then
            echo "::warning::db-bridge-executor-multica container not running - areal -> multica env-dispatch/DAG fetch will not be drained."
            docker logs --tail 40 "$name" 2>/dev/null || true
            exit 0
          fi
          for i in $(seq 1 15); do
            if docker logs --tail 50 "$name" 2>&1 | grep -q "executor ready"; then
              echo "db-bridge-executor-multica ready after $((i * 2))s."
              exit 0
            fi
            echo "waiting for executor readiness... ($i/15)"
            sleep 2
          done
          echo "::warning::db-bridge-executor-multica did not log 'executor ready' within 30s - investigate the executor container (check SUPABASE_URL / BRIDGE_MULTICA_UPSTREAM_URL)."
          docker logs --tail 80 "$name" || true
