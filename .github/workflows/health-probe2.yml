name: health-probe2

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Research V6 run UUID for read-only diagnosis"
        required: true

permissions: {}

jobs:
  diagnose-research-v6-run:
    runs-on: [self-hosted, s89, test]
    timeout-minutes: 5
    steps:
      - name: Inspect stalled Research V6 run without mutation
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          postgres_id="$(docker ps --filter label=com.docker.compose.project=multica-test --filter label=com.docker.compose.service=postgres -q | head -n 1)"
          backend_id="$(docker ps --filter label=com.docker.compose.project=multica-test --filter label=com.docker.compose.service=backend -q | head -n 1)"
          [ -n "$postgres_id" ]
          [ -n "$backend_id" ]

          docker exec -i "$postgres_id" sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -X -v ON_ERROR_STOP=1 -v "run_id=$1" -U "$POSTGRES_USER" -d "$POSTGRES_DB"' sh "$RUN_ID" <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          \pset fieldsep '|'
          SELECT 'RUN',status,orchestrator_version,last_progress_at,next_reconcile_at,updated_at,left(COALESCE(last_error,''),240)
          FROM research_session WHERE id=:'run_id'::uuid;

          SELECT 'WORK_GROUP',kind,status,count(*),max(created_at)
          FROM research_work_item WHERE session_id=:'run_id'::uuid
          GROUP BY kind,status ORDER BY max(created_at),kind,status;

          SELECT 'WORK_RECENT',id,kind,status,target_kind,COALESCE(created_by_director_cycle_id::text,''),
                 COALESCE(assigned_agent_id::text,''),created_at,left(COALESCE(terminal_reason_code,''),80)
          FROM research_work_item WHERE session_id=:'run_id'::uuid
          ORDER BY created_at DESC LIMIT 20;

          SELECT 'CYCLE_RECENT',id,status,trigger_from_sequence,trigger_through_sequence,created_at,
                 COALESCE(started_at::text,''),COALESCE(completed_at::text,''),left(COALESCE(failure_class,''),80),left(COALESCE(diagnostics,''),240)
          FROM research_director_cycle WHERE session_id=:'run_id'::uuid
          ORDER BY created_at DESC LIMIT 12;

          SELECT 'CYCLE_ACTIONS',cycle.id,action.value->>'kind',count(*)
          FROM research_director_cycle cycle
          CROSS JOIN LATERAL jsonb_array_elements(COALESCE(cycle.proposal->'actions','[]'::jsonb)) action(value)
          WHERE cycle.session_id=:'run_id'::uuid
            AND cycle.id=(SELECT id FROM research_director_cycle WHERE session_id=:'run_id'::uuid ORDER BY created_at DESC LIMIT 1)
          GROUP BY cycle.id,action.value->>'kind' ORDER BY action.value->>'kind';

          SELECT 'SUBMISSION_ACTIONS',sub.id,action.value->>'kind',count(*)
          FROM research_v6_work_submission sub
          CROSS JOIN LATERAL jsonb_array_elements(COALESCE(sub.envelope->'actions','[]'::jsonb)) action(value)
          WHERE sub.session_id=:'run_id'::uuid AND sub.contract_kind='director_action_proposal'
            AND sub.id=(SELECT id FROM research_v6_work_submission
              WHERE session_id=:'run_id'::uuid AND contract_kind='director_action_proposal'
              ORDER BY created_at DESC LIMIT 1)
          GROUP BY sub.id,action.value->>'kind' ORDER BY action.value->>'kind';

          SELECT 'TEAM_GROUP',COALESCE(to_jsonb(m)->>'role','legacy'),state,count(*)
          FROM research_team_membership m WHERE session_id=:'run_id'::uuid
          GROUP BY COALESCE(to_jsonb(m)->>'role','legacy'),state
          ORDER BY COALESCE(to_jsonb(m)->>'role','legacy'),state;

          SELECT 'FRONTIER_FACTS',count(*) FILTER (WHERE result.conclusion_state NOT IN ('invalid','refuted')),
                 COALESCE(sum(jsonb_array_length(COALESCE(result.open_questions,'[]'::jsonb)))
                   FILTER (WHERE result.conclusion_state NOT IN ('invalid','refuted')),0)
          FROM research_result_node result
          WHERE result.session_id=:'run_id'::uuid
            AND NOT EXISTS (SELECT 1 FROM research_node_absorption absorbed
              WHERE absorbed.session_id=result.session_id AND absorbed.input_artifact_version_id=result.artifact_version_id);

          SELECT 'DISCUSSION_RECENT',d.id,d.kind,d.status,d.through_event_sequence,d.created_at,d.updated_at,
                 (SELECT count(*) FROM research_discussion_input i WHERE i.discussion_id=d.id),
                 (SELECT count(*) FROM research_discussion_vote v WHERE v.discussion_id=d.id)
          FROM research_discussion d WHERE d.session_id=:'run_id'::uuid
          ORDER BY d.created_at DESC LIMIT 12;

          SELECT 'EVENT_RECENT',sequence,event_type,created_at,COALESCE(payload->>'recovery_kind','')
          FROM research_run_event WHERE session_id=:'run_id'::uuid
          ORDER BY sequence DESC LIMIT 30;

          SELECT 'TRIGGER_FACTS',e.sequence,e.event_type,
            (SELECT count(*) FROM research_director_cycle c WHERE c.session_id=e.session_id
              AND c.trigger_from_sequence<=e.sequence AND c.trigger_through_sequence>=e.sequence),
            (SELECT count(*) FROM research_work_item w WHERE w.session_id=e.session_id AND w.kind='director'
              AND w.status IN ('ready','dispatching','enqueued','running','awaiting_input')),
            (SELECT count(*) FROM research_v6_outbox o WHERE o.session_id=e.session_id
              AND o.kind IN ('create_agent','archive_agent') AND o.status IN ('pending','delivering')),
            (SELECT count(*) FROM research_director_assignment a JOIN research_session s ON s.current_director_assignment_id=a.id
              WHERE s.id=e.session_id AND a.status='active')
          FROM research_run_event e WHERE e.session_id=:'run_id'::uuid AND e.event_type='v6_work_submission_rejected'
          ORDER BY e.sequence DESC LIMIT 1;

          WITH target AS (
            SELECT created_at,sequence,id
            FROM research_run_event
            WHERE session_id=:'run_id'::uuid AND event_type='v6_work_submission_rejected'
            ORDER BY sequence DESC LIMIT 1
          ), eligible AS (
            SELECT e.id,e.session_id,e.created_at,e.sequence
            FROM research_run_event e
            JOIN research_session s ON s.workspace_id=e.workspace_id AND s.id=e.session_id
            JOIN research_director_assignment a ON a.id=s.current_director_assignment_id AND a.status='active'
            WHERE s.orchestrator_version='research-run-v6' AND s.status='running'
              AND e.event_type IN (
                'v6_run_bootstrapped','v6_result_node_accepted','v6_plan_materialized','v6_evidence_screened','v6_integration_materialized',
                'v6_deliberation_materialized','v6_director_adjudication_materialized','v6_work_item_succeeded',
                'v6_work_item_recovered','v6_work_submission_rejected','v6_agent_creation_requested',
                'v6_team_member_joined','v6_team_member_archived','v6_work_item_created','v6_branch_created',
                'v6_match_decision_recorded','v6_discussion_open','v6_discussion_append_turn','v6_discussion_close',
                'v6_dispute_review_tasks_created','v6_integration_commit','v6_report_work_created',
                'v6_report_draft_accepted','v6_report_reviewed','v6_director_unavailable','v6_director_assigned',
                'task_result_accepted','task_attempt_failed','task_blocked','budget_exhausted','run_resumed')
              AND NOT EXISTS (
                SELECT 1 FROM research_director_cycle covered
                WHERE covered.workspace_id=e.workspace_id AND covered.session_id=e.session_id
                  AND covered.trigger_from_sequence<=e.sequence AND covered.trigger_through_sequence>=e.sequence
                  AND (e.event_type<>'v6_result_node_accepted' OR EXISTS (
                    SELECT 1 FROM research_director_brief_page page
                    CROSS JOIN LATERAL jsonb_array_elements(COALESCE(convert_from(page.content_bytes,'UTF8')::jsonb #> '{research,branches}','[]'::jsonb)) branch
                    CROSS JOIN LATERAL jsonb_array_elements(COALESCE(branch #> '{frontier_nodes}','[]'::jsonb)) frontier
                    WHERE page.workspace_id=e.workspace_id AND page.session_id=e.session_id AND page.director_cycle_id=covered.id
                      AND frontier #>> '{node,version_id}'=e.payload->>'artifact_version_id'
                      AND (NOT EXISTS (
                        SELECT 1 FROM research_result_node unresolved
                        WHERE unresolved.workspace_id=e.workspace_id AND unresolved.session_id=e.session_id
                          AND unresolved.artifact_version_id::text=e.payload->>'artifact_version_id'
                          AND jsonb_array_length(COALESCE(unresolved.open_questions,'[]'::jsonb))>0)
                        OR strpos(COALESCE(frontier #>> '{brief_summary}',''),'待回答问题：')>0)))
                  AND (e.event_type<>'v6_discussion_close' OR e.payload->>'status'<>'escalated' OR EXISTS (
                    SELECT 1 FROM research_work_item followup
                    WHERE followup.workspace_id=e.workspace_id AND followup.session_id=e.session_id
                      AND followup.kind='research' AND followup.created_at>e.created_at)))
              AND NOT EXISTS (
                SELECT 1 FROM research_work_item active
                WHERE active.workspace_id=e.workspace_id AND active.session_id=e.session_id AND active.kind='director'
                  AND active.status IN ('ready','dispatching','enqueued','running','awaiting_input'))
              AND NOT EXISTS (
                SELECT 1 FROM research_v6_outbox material_effect
                WHERE material_effect.workspace_id=e.workspace_id AND material_effect.session_id=e.session_id
                  AND material_effect.kind IN ('create_agent','archive_agent')
                  AND material_effect.status IN ('pending','delivering'))
          )
          SELECT 'GLOBAL_TRIGGER_QUEUE',count(*),count(DISTINCT session_id),
            count(*) FILTER (WHERE (eligible.created_at,eligible.sequence,eligible.id)<=(target.created_at,target.sequence,target.id))
          FROM eligible CROSS JOIN target;

          WITH eligible AS (
            SELECT e.id,e.session_id,e.created_at,e.sequence,e.event_type,
              EXISTS (SELECT 1 FROM research_director_cycle covered
                WHERE covered.workspace_id=e.workspace_id AND covered.session_id=e.session_id
                  AND covered.trigger_from_sequence<=e.sequence AND covered.trigger_through_sequence>=e.sequence) AS previously_covered
            FROM research_run_event e
            JOIN research_session s ON s.workspace_id=e.workspace_id AND s.id=e.session_id
            JOIN research_director_assignment a ON a.id=s.current_director_assignment_id AND a.status='active'
            WHERE s.orchestrator_version='research-run-v6' AND s.status='running'
              AND e.event_type IN (
                'v6_run_bootstrapped','v6_result_node_accepted','v6_plan_materialized','v6_evidence_screened','v6_integration_materialized',
                'v6_deliberation_materialized','v6_director_adjudication_materialized','v6_work_item_succeeded',
                'v6_work_item_recovered','v6_work_submission_rejected','v6_agent_creation_requested',
                'v6_team_member_joined','v6_team_member_archived','v6_work_item_created','v6_branch_created',
                'v6_match_decision_recorded','v6_discussion_open','v6_discussion_append_turn','v6_discussion_close',
                'v6_dispute_review_tasks_created','v6_integration_commit','v6_report_work_created',
                'v6_report_draft_accepted','v6_report_reviewed','v6_director_unavailable','v6_director_assigned',
                'task_result_accepted','task_attempt_failed','task_blocked','budget_exhausted','run_resumed')
              AND NOT EXISTS (
                SELECT 1 FROM research_director_cycle covered
                WHERE covered.workspace_id=e.workspace_id AND covered.session_id=e.session_id
                  AND covered.trigger_from_sequence<=e.sequence AND covered.trigger_through_sequence>=e.sequence
                  AND (e.event_type<>'v6_result_node_accepted' OR EXISTS (
                    SELECT 1 FROM research_director_brief_page page
                    CROSS JOIN LATERAL jsonb_array_elements(COALESCE(convert_from(page.content_bytes,'UTF8')::jsonb #> '{research,branches}','[]'::jsonb)) branch
                    CROSS JOIN LATERAL jsonb_array_elements(COALESCE(branch #> '{frontier_nodes}','[]'::jsonb)) frontier
                    WHERE page.workspace_id=e.workspace_id AND page.session_id=e.session_id AND page.director_cycle_id=covered.id
                      AND frontier #>> '{node,version_id}'=e.payload->>'artifact_version_id'
                      AND (NOT EXISTS (
                        SELECT 1 FROM research_result_node unresolved
                        WHERE unresolved.workspace_id=e.workspace_id AND unresolved.session_id=e.session_id
                          AND unresolved.artifact_version_id::text=e.payload->>'artifact_version_id'
                          AND jsonb_array_length(COALESCE(unresolved.open_questions,'[]'::jsonb))>0)
                        OR strpos(COALESCE(frontier #>> '{brief_summary}',''),'待回答问题：')>0)))
                  AND (e.event_type<>'v6_discussion_close' OR e.payload->>'status'<>'escalated' OR EXISTS (
                    SELECT 1 FROM research_work_item followup
                    WHERE followup.workspace_id=e.workspace_id AND followup.session_id=e.session_id
                      AND followup.kind='research' AND followup.created_at>e.created_at)))
              AND NOT EXISTS (SELECT 1 FROM research_work_item active
                WHERE active.workspace_id=e.workspace_id AND active.session_id=e.session_id AND active.kind='director'
                  AND active.status IN ('ready','dispatching','enqueued','running','awaiting_input'))
              AND NOT EXISTS (SELECT 1 FROM research_v6_outbox material_effect
                WHERE material_effect.workspace_id=e.workspace_id AND material_effect.session_id=e.session_id
                  AND material_effect.kind IN ('create_agent','archive_agent')
                  AND material_effect.status IN ('pending','delivering'))
          )
          SELECT 'TRIGGER_QUEUE_ROW',row_number() OVER (ORDER BY e.created_at,e.sequence,e.id),
            e.session_id,e.sequence,e.event_type,e.previously_covered,
            COALESCE(w.status,''),COALESCE(c.status,''),COALESCE(w.client_key,'')
          FROM eligible e
          LEFT JOIN research_work_item w ON w.session_id=e.session_id AND w.client_key=
            'director-cycle:' || CASE WHEN e.previously_covered THEN 'event-frontier-repair:' ELSE 'event:' END || e.id::text
          LEFT JOIN research_director_cycle c ON c.work_item_id=w.id
          ORDER BY e.created_at,e.sequence,e.id LIMIT 20;
          SQL

          followup_count="$(
            docker exec -i "$postgres_id" sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -X -At -v ON_ERROR_STOP=1 -v "run_id=$1" -U "$POSTGRES_USER" -d "$POSTGRES_DB"' sh "$RUN_ID" <<'SQL'
          WITH escalated AS (
            SELECT max(updated_at) AS at
            FROM research_discussion
            WHERE session_id=:'run_id'::uuid AND status='escalated'
          )
          SELECT count(*)
          FROM research_work_item,escalated
          WHERE session_id=:'run_id'::uuid AND kind='research' AND created_at>escalated.at;
          SQL
          )"

          docker logs --since 45m "$backend_id" 2>&1 \
            | grep -E "$RUN_ID|research_run_reconcile|v6_discussion_close|idempotency" \
            | tail -n 200 || true

          if [ "$followup_count" -eq 0 ]; then
            echo "VERDICT=RED no_research_followup_after_latest_escalated_discussion"
            exit 1
          fi
          echo "VERDICT=GREEN research_followup_created_after_latest_escalated_discussion count=$followup_count"
