# One-shot / rare ops against the Aliyun host DB. workflow_dispatch only.
# Does not deploy. Does not touch images. Runs as the deploy owner `dev`.
name: ops-aliyun-sql

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Named ops action to run"
        required: true
        type: choice
        options:
          - research_fleet_runtime_match_wendy
          - voice_call_diagnose
          - research_wake_diagnose
          - research_wake_followup
          - research_mirror_check
          - research_fleet_model_backfill
          - publish_agent_avatars_v3

jobs:
  run:
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 10
    environment:
      name: aliyun-dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Preflight runner identity
        run: |
          set -euo pipefail
          actual="$(id -un)"
          echo "runner user=${actual} uid=$(id -u) groups=$(id -Gn)"
          echo "home=${HOME:-} pwd=$(pwd)"
          ls -la /data/multica/.env /data/multica/docker-compose.yml /data/multica/docker-compose.aliyun.yml 2>&1 || true
          # Deploy owner is `dev`; some runner registrations may use another login
          # that is still in the docker group and can read the host dotenv.
          if [ ! -r /data/multica/.env ]; then
            echo "::error::cannot read /data/multica/.env as ${actual}"
            exit 1
          fi

      - name: research_fleet_runtime_match_wendy
        if: inputs.action == 'research_fleet_runtime_match_wendy'
        run: |
          set -euo pipefail
          DEPLOY_DIR=/data/multica
          cd "$DEPLOY_DIR"
          echo "=== host layout ==="
          ls -la "$DEPLOY_DIR" | head -40
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | head -40

          dotenv_value() {
            local key="$1" default="${2:-}"
            python3 - "$key" "$default" <<'PY'
          import sys
          from pathlib import Path
          key, default = sys.argv[1], sys.argv[2]
          for line in Path("/data/multica/.env").read_text().splitlines():
              if line.startswith(key + "="):
                  print(line.split("=", 1)[1].strip().strip('"').strip("'"))
                  raise SystemExit(0)
          print(default)
          PY
          }

          db_user="$(dotenv_value POSTGRES_USER multica)"
          db_name="$(dotenv_value POSTGRES_DB multica)"
          db_password="$(dotenv_value POSTGRES_PASSWORD)"
          if [ -z "$db_user" ] || [ -z "$db_name" ] || [ -z "$db_password" ]; then
            echo "::error::POSTGRES_USER/DB/PASSWORD missing in ${DEPLOY_DIR}/.env"
            exit 1
          fi

          # Prefer compose project lookup when compose files exist; otherwise
          # discover the live postgres container by name/image.
          postgres_id=""
          if [ -f "${DEPLOY_DIR}/docker-compose.yml" ]; then
            compose_args=(--env-file "${DEPLOY_DIR}/.env" -f "${DEPLOY_DIR}/docker-compose.yml")
            [ -f "${DEPLOY_DIR}/docker-compose.selfhost.yml" ] && compose_args+=(-f "${DEPLOY_DIR}/docker-compose.selfhost.yml")
            [ -f "${DEPLOY_DIR}/docker-compose.aliyun.yml" ] && compose_args+=(-f "${DEPLOY_DIR}/docker-compose.aliyun.yml")
            postgres_id="$(docker compose "${compose_args[@]}" ps -q postgres || true)"
          fi
          if [ -z "$postgres_id" ]; then
            # Prefer the compose postgres service name; never match db-bridge.
            postgres_id="$(docker ps --format '{{.Names}} {{.ID}}' | awk '$1 ~ /postgres/ {print $2; exit}')"
          fi
          if [ -z "$postgres_id" ]; then
            postgres_id="$(docker ps --format '{{.Image}} {{.ID}}' | awk '$1 ~ /pgvector|postgres/ {print $2; exit}')"
          fi
          if [ -z "$postgres_id" ]; then
            echo "::error::PostgreSQL container is not running"
            exit 1
          fi
          echo "postgres container=${postgres_id} name=$(docker inspect -f '{{.Name}}' "$postgres_id")"

          run_sql() {
            local sql="$1"
            printf '%s\n' "$sql" | docker exec -i \
              -e PGPASSWORD="$db_password" \
              "$postgres_id" \
              psql -h 127.0.0.1 -U "$db_user" -d "$db_name" -v ON_ERROR_STOP=1
          }

          echo "=== BEFORE: Wendy + research fleet agents ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (
            SELECT id FROM workspace WHERE slug = 'lrm-team' LIMIT 1
          ),
          wendy AS (
            SELECT a.id, a.name, a.runtime_id, a.runtime_mode, r.name AS runtime_name, r.status AS runtime_status
            FROM agent a
            LEFT JOIN agent_runtime r ON r.id = a.runtime_id
            JOIN ws ON a.workspace_id = ws.id
            WHERE a.archived_at IS NULL
              AND lower(a.name) LIKE '%wendy%'
            ORDER BY a.created_at ASC
            LIMIT 5
          )
          SELECT 'wendy' AS kind, id::text, name, runtime_id::text, runtime_mode, runtime_name, runtime_status
          FROM wendy
          UNION ALL
          SELECT 'fleet', a.id::text, a.name, a.runtime_id::text, a.runtime_mode, r.name, r.status
          FROM research_fleet_member m
          JOIN research_fleet f ON f.id = m.fleet_id
          JOIN ws ON f.workspace_id = ws.id
          JOIN agent a ON a.id = m.agent_id
          LEFT JOIN agent_runtime r ON r.id = a.runtime_id
          ORDER BY 1, 3;
          SQL
          )"

          echo "=== APPLY: set fleet agents (+ lead) to Wendy runtime; repair lead pointer ==="
          run_sql "$(cat <<'SQL'
          BEGIN;

          WITH ws AS (
            SELECT id FROM workspace WHERE slug = 'lrm-team' LIMIT 1
          ),
          wendy AS (
            SELECT a.id AS agent_id, a.runtime_id, a.runtime_mode
            FROM agent a
            JOIN ws ON a.workspace_id = ws.id
            WHERE a.archived_at IS NULL
              AND lower(a.name) = 'wendy'
            ORDER BY a.created_at ASC
            LIMIT 1
          ),
          wendy_fallback AS (
            SELECT a.id AS agent_id, a.runtime_id, a.runtime_mode
            FROM agent a
            JOIN ws ON a.workspace_id = ws.id
            WHERE a.archived_at IS NULL
              AND lower(a.name) LIKE '%wendy%'
              AND EXISTS (SELECT 1 FROM wendy) IS FALSE
            ORDER BY a.created_at ASC
            LIMIT 1
          ),
          src AS (
            SELECT * FROM wendy
            UNION ALL
            SELECT * FROM wendy_fallback
            LIMIT 1
          )
          SELECT CASE WHEN COUNT(*) = 1 THEN 'wendy_ok' ELSE 'wendy_missing' END AS check
          FROM src;

          -- Fail closed if Wendy / runtime missing.
          DO $$
          DECLARE
            rid uuid;
            rmode text;
          BEGIN
            SELECT a.runtime_id, a.runtime_mode
              INTO rid, rmode
            FROM agent a
            JOIN workspace w ON w.id = a.workspace_id
            WHERE w.slug = 'lrm-team'
              AND a.archived_at IS NULL
              AND (lower(a.name) = 'wendy' OR lower(a.name) LIKE '%wendy%')
            ORDER BY CASE WHEN lower(a.name) = 'wendy' THEN 0 ELSE 1 END, a.created_at
            LIMIT 1;

            IF rid IS NULL THEN
              RAISE EXCEPTION 'Wendy runtime_id is NULL or Wendy agent not found in lrm-team';
            END IF;

            UPDATE agent a
            SET runtime_id = rid,
                runtime_mode = COALESCE(rmode, a.runtime_mode),
                updated_at = now()
            FROM research_fleet_member m
            JOIN research_fleet f ON f.id = m.fleet_id
            JOIN workspace w ON w.id = f.workspace_id
            WHERE w.slug = 'lrm-team'
              AND a.id = m.agent_id
              AND a.workspace_id = w.id
              AND a.archived_at IS NULL
              AND m.status <> 'archived';

            -- Also fix any agent still named as seed roles even if member row drifted.
            UPDATE agent a
            SET runtime_id = rid,
                runtime_mode = COALESCE(rmode, a.runtime_mode),
                updated_at = now()
            FROM workspace w
            WHERE w.slug = 'lrm-team'
              AND a.workspace_id = w.id
              AND a.archived_at IS NULL
              AND a.name IN ('罗纳尔多', '寻源手', '深读手', '交叉验证', '报告官', '寻道手', '探探手');

            -- Repair fleet lead to the active lead member (avoids wake → not a fleet member).
            UPDATE research_fleet f
            SET lead_agent_id = m.agent_id,
                updated_at = now()
            FROM research_fleet_member m, workspace w
            WHERE w.slug = 'lrm-team'
              AND f.workspace_id = w.id
              AND m.fleet_id = f.id
              AND m.workspace_id = w.id
              AND m.is_lead = true
              AND m.status = 'active';
          END $$;

          COMMIT;
          SQL
          )"

          echo "=== AFTER ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (
            SELECT id FROM workspace WHERE slug = 'lrm-team' LIMIT 1
          )
          SELECT a.name, m.role, m.status, m.is_lead,
                 a.runtime_id::text, r.name AS runtime_name, r.status AS runtime_status,
                 f.lead_agent_id::text AS fleet_lead
          FROM research_fleet f
          JOIN ws ON f.workspace_id = ws.id
          JOIN research_fleet_member m ON m.fleet_id = f.id
          JOIN agent a ON a.id = m.agent_id
          LEFT JOIN agent_runtime r ON r.id = a.runtime_id
          WHERE m.status <> 'archived'
          ORDER BY m.is_lead DESC, a.name;
          SQL
          )"

      - name: voice_call_diagnose
        if: inputs.action == 'voice_call_diagnose'
        run: |
          set -euo pipefail
          DEPLOY_DIR=/data/multica
          cd "$DEPLOY_DIR"

          dotenv_value() {
            local key="$1" default="${2:-}"
            python3 - "$key" "$default" <<'PY'
          import sys
          from pathlib import Path
          key, default = sys.argv[1], sys.argv[2]
          for line in Path("/data/multica/.env").read_text().splitlines():
              if line.startswith(key + "="):
                  print(line.split("=", 1)[1].strip().strip('"').strip("'"))
                  raise SystemExit(0)
          print(default)
          PY
          }

          echo "=== RTC-related env (redacted) ==="
          python3 <<'PY'
          from pathlib import Path
          keys = [
            "MULTICA_PUBLIC_URL","MULTICA_APP_URL","FRONTEND_ORIGIN",
            "VOLCENGINE_RTC_APP_ID","VOLCENGINE_RTC_ARK_ENDPOINT_ID",
            "VOLCENGINE_RTC_ASR_APP_ID","VOLCENGINE_RTC_TTS_APP_ID",
            "VOLCENGINE_RTC_CALLBACK_URL","VOLCENGINE_RTC_CALLBACK_SIGNATURE",
            "VOLCENGINE_RTC_ACCESS_KEY_ID","VOLCENGINE_RTC_APP_KEY",
            "DOUBAO_SPEECH_API_KEY","VOLCENGINE_RTC_TTS_VOICE_ID",
          ]
          vals = {}
          for line in Path("/data/multica/.env").read_text().splitlines():
              if "=" in line and not line.strip().startswith("#"):
                  k,v = line.split("=",1)
                  vals[k.strip()] = v.strip().strip('"').strip("'")
          # Also check docker inspect backend env
          import subprocess, json
          try:
              out = subprocess.check_output(["docker","inspect","multica-backend-1"], text=True)
              env = {e.split("=",1)[0]: e.split("=",1)[1] for e in json.loads(out)[0]["Config"]["Env"] if "=" in e}
          except Exception as e:
              env = {"_inspect_error": str(e)}
          print("host .env:")
          for k in keys:
              v = vals.get(k,"")
              if not v:
                  print(f"  {k}=<missing>")
              elif "KEY" in k or "SECRET" in k or "SIGNATURE" in k or "PASSWORD" in k or k.endswith("_ID") and "ARK" not in k and "ASR" not in k and "TTS" not in k and "APP_ID" not in k:
                  print(f"  {k}=set(len={len(v)})")
              elif k in ("VOLCENGINE_RTC_APP_KEY","VOLCENGINE_RTC_ACCESS_KEY_ID","VOLCENGINE_RTC_CALLBACK_SIGNATURE","DOUBAO_SPEECH_API_KEY"):
                  print(f"  {k}=set(len={len(v)})")
              else:
                  print(f"  {k}={v}")
          print("backend container env:")
          for k in keys:
              v = env.get(k,"")
              if not v:
                  print(f"  {k}=<missing>")
              elif any(x in k for x in ("KEY","SECRET","SIGNATURE","PASSWORD")):
                  print(f"  {k}=set(len={len(v)})")
              else:
                  print(f"  {k}={v}")
          PY

          echo "=== local callback reachability ==="
          curl -sk --max-time 5 -o /tmp/cb.out -w "loopback8090:%{http_code}\n" -X POST http://127.0.0.1:8090/api/voice-calls/callback -H 'content-type: application/json' -d '{}' || true
          head -c 200 /tmp/cb.out; echo
          curl -sk --max-time 5 -o /tmp/hz.out -w "loopback443:%{http_code}\n" https://127.0.0.1/healthz || true
          curl -sk --max-time 5 -o /tmp/hz2.out -w "public_leagent:%{http_code}\n" https://leagent.me/healthz || true

          echo "=== backend logs (voice) ==="
          docker logs multica-backend-1 --since 48h 2>&1 | grep -iE 'voice call|voicecall|StartVoiceChat|callback|volcengine' | tail -80 || true

          echo "=== caddy logs (callback) ==="
          docker logs multica-caddy --since 72h 2>&1 | grep -iE 'voice-calls/callback|voice-calls' | tail -40 || true

          db_user="$(dotenv_value POSTGRES_USER multica)"
          db_name="$(dotenv_value POSTGRES_DB multica)"
          db_password="$(dotenv_value POSTGRES_PASSWORD)"
          postgres_id="$(docker ps --format '{{.Names}} {{.ID}}' | awk '$1 ~ /postgres/ {print $2; exit}')"
          echo "postgres=${postgres_id}"

          run_sql() {
            printf '%s\n' "$1" | docker exec -i -e PGPASSWORD="$db_password" "$postgres_id" \
              psql -h 127.0.0.1 -U "$db_user" -d "$db_name" -v ON_ERROR_STOP=1
          }

          echo "=== recent voice_call_session ==="
          run_sql "$(cat <<'SQL'
          SELECT id::text, status, error_code,
                 connected_at IS NOT NULL AS has_connected,
                 input_audio_ms, output_audio_ms,
                 left(room_id,40) AS room_id,
                 created_at AT TIME ZONE 'Asia/Shanghai' AS created_cst,
                 updated_at AT TIME ZONE 'Asia/Shanghai' AS updated_cst
          FROM voice_call_session
          ORDER BY created_at DESC
          LIMIT 20;
          SQL
          )"

          echo "=== status histogram (7d) ==="
          run_sql "$(cat <<'SQL'
          SELECT status, error_code, count(*) 
          FROM voice_call_session
          WHERE created_at > now() - interval '7 days'
          GROUP BY 1,2 ORDER BY 3 DESC;
          SQL
          )"

          echo "=== turns for latest 3 calls ==="
          run_sql "$(cat <<'SQL'
          WITH latest AS (
            SELECT id FROM voice_call_session ORDER BY created_at DESC LIMIT 3
          )
          SELECT t.call_session_id::text, t.sequence, t.speaker, left(coalesce(t.transcript,''),60) AS transcript,
                 t.spoken_duration_ms
          FROM voice_call_turn t
          JOIN latest l ON l.id = t.call_session_id
          ORDER BY t.call_session_id, t.sequence;
          SQL
          )"

      - name: research_wake_diagnose
        if: inputs.action == 'research_wake_diagnose'
        run: |
          set -euo pipefail
          DEPLOY_DIR=/data/multica
          dotenv_value() {
            python3 - "$1" "${2:-}" <<'PY'
          import sys
          from pathlib import Path
          key, default = sys.argv[1], sys.argv[2]
          for line in Path("/data/multica/.env").read_text().splitlines():
              if line.startswith(key + "="):
                  print(line.split("=", 1)[1].strip().strip('"').strip("'"))
                  raise SystemExit(0)
          print(default)
          PY
          }
          db_user="$(dotenv_value POSTGRES_USER multica)"
          db_name="$(dotenv_value POSTGRES_DB multica)"
          db_password="$(dotenv_value POSTGRES_PASSWORD)"
          postgres_id="$(docker ps --format '{{.Names}} {{.ID}}' | awk '$1 ~ /postgres/ {print $2; exit}')"
          run_sql() {
            printf '%s\n' "$1" | docker exec -i -e PGPASSWORD="$db_password" "$postgres_id" \
              psql -h 127.0.0.1 -U "$db_user" -d "$db_name" -v ON_ERROR_STOP=1
          }

          echo "=== fleet + lead vs members ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (SELECT id FROM workspace WHERE slug='lrm-team')
          SELECT f.id::text AS fleet_id,
                 f.lead_agent_id::text AS lead_agent_id,
                 a.name AS lead_name,
                 a.archived_at IS NOT NULL AS lead_agent_archived,
                 a.runtime_id::text,
                 r.name AS runtime_name, r.status AS runtime_status,
                 EXISTS (
                   SELECT 1 FROM research_fleet_member m
                   WHERE m.workspace_id = f.workspace_id
                     AND m.agent_id = f.lead_agent_id
                     AND m.status <> 'archived'
                 ) AS lead_is_active_member
          FROM research_fleet f
          JOIN ws ON ws.id = f.workspace_id
          LEFT JOIN agent a ON a.id = f.lead_agent_id
          LEFT JOIN agent_runtime r ON r.id = a.runtime_id;
          SQL
          )"

          echo "=== all fleet members (incl archived) ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (SELECT id FROM workspace WHERE slug='lrm-team')
          SELECT m.role, m.status, m.is_lead, a.name, a.id::text AS agent_id,
                 a.archived_at IS NOT NULL AS agent_archived,
                 a.runtime_id::text, r.name AS runtime_name, r.status AS runtime_status
          FROM research_fleet f
          JOIN ws ON ws.id=f.workspace_id
          JOIN research_fleet_member m ON m.fleet_id=f.id
          JOIN agent a ON a.id=m.agent_id
          LEFT JOIN agent_runtime r ON r.id=a.runtime_id
          ORDER BY m.status, m.is_lead DESC, m.created_at;
          SQL
          )"

          echo "=== recent research messages + wake targets ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (SELECT id FROM workspace WHERE slug='lrm-team')
          SELECT m.created_at AT TIME ZONE 'Asia/Shanghai' AS created_cst,
                 m.sender_type, left(m.body,40) AS body,
                 m.target_agent_id::text AS target_id,
                 a.name AS target_name,
                 m.card_kind,
                 m.meta::text AS meta
          FROM research_message m
          JOIN ws ON ws.id=m.workspace_id
          LEFT JOIN agent a ON a.id=m.target_agent_id
          ORDER BY m.created_at DESC
          LIMIT 15;
          SQL
          )"

          echo "=== lead member lookup (exact wake check) ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (SELECT id FROM workspace WHERE slug='lrm-team'),
          fleet AS (
            SELECT f.* FROM research_fleet f JOIN ws ON ws.id=f.workspace_id
          )
          SELECT
            fleet.lead_agent_id::text AS lead_id,
            lead_a.name AS lead_name,
            m.id::text AS member_id,
            m.status AS member_status,
            m.role,
            m.is_lead,
            (m.id IS NOT NULL AND m.status <> 'archived') AS wake_would_pass
          FROM fleet
          LEFT JOIN agent lead_a ON lead_a.id = fleet.lead_agent_id
          LEFT JOIN research_fleet_member m
            ON m.workspace_id = fleet.workspace_id
           AND m.agent_id = fleet.lead_agent_id
           AND m.status <> 'archived';
          SQL
          )"

          echo "=== distinct message targets wake check ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (SELECT id FROM workspace WHERE slug='lrm-team'),
          targets AS (
            SELECT DISTINCT target_agent_id AS agent_id
            FROM research_message
            WHERE workspace_id = (SELECT id FROM ws)
              AND target_agent_id IS NOT NULL
          )
          SELECT t.agent_id::text,
                 a.name,
                 m.status AS active_member_status,
                 m.role,
                 (m.id IS NOT NULL) AS wake_would_pass
          FROM targets t
          LEFT JOIN agent a ON a.id = t.agent_id
          LEFT JOIN research_fleet_member m
            ON m.workspace_id = (SELECT id FROM ws)
           AND m.agent_id = t.agent_id
           AND m.status <> 'archived'
          ORDER BY a.name NULLS LAST;
          SQL
          )"

          echo "=== backend wake logs ==="
          docker logs multica-backend-1 --since 6h 2>&1 | grep -iE 'research agent wake|wake failed|not a research fleet|enqueue research' | tail -40 || true

      - name: research_wake_followup
        if: inputs.action == 'research_wake_followup'
        run: |
          set -euo pipefail
          dotenv_value() {
            python3 - "$1" "${2:-}" <<'PY'
          import sys
          from pathlib import Path
          key, default = sys.argv[1], sys.argv[2]
          for line in Path("/data/multica/.env").read_text().splitlines():
              if line.startswith(key + "="):
                  print(line.split("=", 1)[1].strip().strip('"').strip("'"))
                  raise SystemExit(0)
          print(default)
          PY
          }
          db_user="$(dotenv_value POSTGRES_USER multica)"
          db_name="$(dotenv_value POSTGRES_DB multica)"
          db_password="$(dotenv_value POSTGRES_PASSWORD)"
          postgres_id="$(docker ps --format '{{.Names}} {{.ID}}' | awk '$1 ~ /postgres/ {print $2; exit}')"
          run_sql() {
            printf '%s\n' "$1" | docker exec -i -e PGPASSWORD="$db_password" "$postgres_id" \
              psql -h 127.0.0.1 -U "$db_user" -d "$db_name" -v ON_ERROR_STOP=1
          }

          LEAD=ccb015de-bebc-4635-8e83-c925174ff784
          echo "=== chat sessions for research lead ==="
          run_sql "SELECT id::text, title, status, agent_id::text, runtime_id::text, created_at AT TIME ZONE 'Asia/Shanghai' AS created_cst, updated_at AT TIME ZONE 'Asia/Shanghai' AS updated_cst FROM chat_session WHERE agent_id='$LEAD'::uuid ORDER BY created_at DESC LIMIT 10;"

          echo "=== recent chat messages for research: sessions ==="
          run_sql "$(cat <<SQL
          SELECT cs.title, cm.role, left(cm.content,80) AS content,
                 cm.created_at AT TIME ZONE 'Asia/Shanghai' AS created_cst,
                 cm.task_id::text
          FROM chat_message cm
          JOIN chat_session cs ON cs.id = cm.chat_session_id
          WHERE cs.agent_id = '$LEAD'::uuid
            AND cs.title LIKE 'research:%'
          ORDER BY cm.created_at DESC
          LIMIT 20;
          SQL
          )"

          echo "=== recent inbox/tasks for lead ==="
          run_sql "$(cat <<SQL
          SELECT t.id::text, t.status, t.task_type, left(coalesce(t.error,''),80) AS err,
                 t.created_at AT TIME ZONE 'Asia/Shanghai' AS created_cst,
                 t.updated_at AT TIME ZONE 'Asia/Shanghai' AS updated_cst,
                 t.runtime_id::text
          FROM agent_task t
          WHERE t.agent_id = '$LEAD'::uuid
          ORDER BY t.created_at DESC
          LIMIT 15;
          SQL
          )" 2>&1 || run_sql "$(cat <<SQL
          SELECT column_name FROM information_schema.columns WHERE table_name='agent_inbox_event' ORDER BY 1;
          SQL
          )"

          echo "=== agent_inbox_event for lead runtime ==="
          run_sql "$(cat <<SQL
          SELECT e.id::text, e.status, e.event_type, left(coalesce(e.error,''),100) AS err,
                 e.created_at AT TIME ZONE 'Asia/Shanghai' AS created_cst,
                 e.runtime_id::text
          FROM agent_inbox_event e
          WHERE e.agent_id = '$LEAD'::uuid
          ORDER BY e.created_at DESC
          LIMIT 15;
          SQL
          )" 2>&1 || true

          echo "=== backend logs around wake (today) ==="
          docker logs multica-backend-1 --since 8h 2>&1 | grep -iE 'research|wake|ccb015de|EnqueueChat|chat task|MAOZH2' | tail -60 || true

          echo "=== daemon connectivity: runtime last seen ==="
          run_sql "SELECT id::text, name, status, last_seen_at AT TIME ZONE 'Asia/Shanghai' AS last_seen_cst, updated_at AT TIME ZONE 'Asia/Shanghai' AS updated_cst FROM agent_runtime WHERE id IN ('5fac011a-aaa3-4000-a3b5-9daf3a17219f'::uuid, '89757d75-aca0-4f33-adf6-91817d75a4f3'::uuid);"

      - name: research_mirror_check
        if: inputs.action == 'research_mirror_check'
        run: |
          set -euo pipefail
          dotenv_value() {
            python3 - "$1" "${2:-}" <<'PY'
          import sys
          from pathlib import Path
          key, default = sys.argv[1], sys.argv[2]
          for line in Path("/data/multica/.env").read_text().splitlines():
              if line.startswith(key + "="):
                  print(line.split("=", 1)[1].strip().strip('"').strip("'"))
                  raise SystemExit(0)
          print(default)
          PY
          }
          db_user="$(dotenv_value POSTGRES_USER multica)"
          db_name="$(dotenv_value POSTGRES_DB multica)"
          db_password="$(dotenv_value POSTGRES_PASSWORD)"
          postgres_id="$(docker ps --format '{{.Names}} {{.ID}}' | awk '$1 ~ /postgres/ {print $2; exit}')"
          run_sql() {
            printf '%s\n' "$1" | docker exec -i -e PGPASSWORD="$db_password" "$postgres_id" \
              psql -h 127.0.0.1 -U "$db_user" -d "$db_name" -v ON_ERROR_STOP=1
          }
          echo "=== backend image ==="
          docker inspect multica-backend-1 --format 'image={{.Config.Image}} created={{.Created}}'
          echo "=== mirror warn logs ==="
          docker logs multica-backend-1 --since 48h 2>&1 | grep -i 'research chat mirror' | tail -30 || echo '(none)'
          echo "=== research_messages today ==="
          run_sql "SELECT created_at AT TIME ZONE 'Asia/Shanghai' AS cst, sender_type, card_kind, left(body,120) AS body, meta::text FROM research_message WHERE created_at > now() - interval '12 hours' ORDER BY created_at;"
          echo "=== backfill missing assistant mirror for latest research chat ==="
          run_sql "$(cat <<'SQL'
          WITH chat AS (
            SELECT cm.id AS chat_msg_id, cm.content, cm.created_at, cs.workspace_id, cs.agent_id,
                   substring(cs.title from 10) AS research_session_id
            FROM chat_message cm
            JOIN chat_session cs ON cs.id = cm.chat_session_id
            WHERE cs.title LIKE 'research:%'
              AND cm.role = 'assistant'
              AND cm.created_at > now() - interval '12 hours'
          ),
          missing AS (
            SELECT c.*, rs.id AS session_uuid
            FROM chat c
            JOIN research_session rs
              ON rs.id = c.research_session_id::uuid
             AND rs.workspace_id = c.workspace_id
            WHERE NOT EXISTS (
              SELECT 1 FROM research_message rm
              WHERE rm.session_id = rs.id
                AND rm.sender_type = 'agent'
                AND rm.sender_id = c.agent_id
                AND rm.body = c.content
            )
          )
          INSERT INTO research_message (
            workspace_id, session_id, sender_type, sender_id, target_agent_id, body, card_kind, meta, created_at
          )
          SELECT workspace_id, session_uuid, 'agent', agent_id, NULL, content, 'chat',
                 '{"mirrored_from":"chat","backfill":true}'::jsonb, created_at
          FROM missing
          RETURNING id::text, session_id::text, left(body,80) AS body, created_at AT TIME ZONE 'Asia/Shanghai' AS cst;
          SQL
          )"

      - name: research_fleet_model_backfill
        if: inputs.action == 'research_fleet_model_backfill'
        run: |
          set -euo pipefail
          DEPLOY_DIR=/data/multica
          dotenv_value() {
            python3 - "$1" "${2:-}" <<'PY'
          import sys
          from pathlib import Path
          key, default = sys.argv[1], sys.argv[2]
          for line in Path("/data/multica/.env").read_text().splitlines():
              if line.startswith(key + "="):
                  print(line.split("=", 1)[1].strip().strip('"').strip("'"))
                  raise SystemExit(0)
          print(default)
          PY
          }
          db_user="$(dotenv_value POSTGRES_USER multica)"
          db_name="$(dotenv_value POSTGRES_DB multica)"
          db_password="$(dotenv_value POSTGRES_PASSWORD)"
          postgres_id="$(docker ps --format '{{.Names}} {{.ID}}' | awk '$1 ~ /postgres/ {print $2; exit}')"
          run_sql() {
            printf '%s\n' "$1" | docker exec -i -e PGPASSWORD="$db_password" "$postgres_id" \
              psql -h 127.0.0.1 -U "$db_user" -d "$db_name" -v ON_ERROR_STOP=1
          }

          echo "=== before: active fleet agents with blank/null model ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (SELECT id FROM workspace WHERE slug='lrm-team')
          SELECT a.id::text, a.name, a.model, r.provider, r.name AS runtime_name, r.status
          FROM research_fleet f
          JOIN ws ON ws.id = f.workspace_id
          JOIN research_fleet_member m ON m.fleet_id = f.id AND m.status <> 'archived'
          JOIN agent a ON a.id = m.agent_id
          LEFT JOIN agent_runtime r ON r.id = a.runtime_id
          WHERE coalesce(trim(a.model), '') = ''
          ORDER BY m.is_lead DESC, a.name;
          SQL
          )"

          echo "=== backfill blank models by runtime provider ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (SELECT id FROM workspace WHERE slug='lrm-team'),
          targets AS (
            SELECT a.id AS agent_id,
                   CASE lower(coalesce(r.provider, ''))
                     WHEN 'cursor' THEN 'composer-1.5'
                     WHEN 'anthropic' THEN 'claude-sonnet-4-6'
                     WHEN 'claude' THEN 'claude-sonnet-4-6'
                     WHEN 'pi' THEN 'claude-sonnet-4-6'
                     WHEN 'openai' THEN 'gpt-5.4'
                     WHEN 'codex' THEN 'gpt-5.4'
                     WHEN 'copilot' THEN 'gpt-5.4'
                     ELSE 'composer-1.5'
                   END AS model
            FROM research_fleet f
            JOIN ws ON ws.id = f.workspace_id
            JOIN research_fleet_member m ON m.fleet_id = f.id AND m.status <> 'archived'
            JOIN agent a ON a.id = m.agent_id
            LEFT JOIN agent_runtime r ON r.id = a.runtime_id
            WHERE coalesce(trim(a.model), '') = ''
          )
          UPDATE agent a
          SET model = t.model, updated_at = now()
          FROM targets t
          WHERE a.id = t.agent_id
          RETURNING a.id::text, a.name, a.model;
          SQL
          )"

          echo "=== after: active fleet agent models ==="
          run_sql "$(cat <<'SQL'
          WITH ws AS (SELECT id FROM workspace WHERE slug='lrm-team')
          SELECT a.id::text, a.name, a.model, r.provider, r.status
          FROM research_fleet f
          JOIN ws ON ws.id = f.workspace_id
          JOIN research_fleet_member m ON m.fleet_id = f.id AND m.status <> 'archived'
          JOIN agent a ON a.id = m.agent_id
          LEFT JOIN agent_runtime r ON r.id = a.runtime_id
          ORDER BY m.is_lead DESC, a.name;
          SQL
          )"

      - name: Checkout for avatar publish
        if: inputs.action == 'publish_agent_avatars_v3'
        uses: actions/checkout@v4

      - name: Setup Go for avatar publish
        if: inputs.action == 'publish_agent_avatars_v3'
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: publish_agent_avatars_v3
        if: inputs.action == 'publish_agent_avatars_v3'
        run: |
          set -euo pipefail
          dotenv_value() {
            local key="$1"
            python3 - "$key" <<'PY'
          import sys
          from pathlib import Path
          key = sys.argv[1]
          for line in Path("/data/multica/.env").read_text().splitlines():
              if line.startswith(key + "="):
                  print(line.split("=", 1)[1].strip().strip('"').strip("'"))
                  raise SystemExit(0)
          PY
          }
          export S3_BUCKET="$(dotenv_value S3_BUCKET)"
          export S3_REGION="$(dotenv_value S3_REGION)"
          export AWS_ENDPOINT_URL="$(dotenv_value AWS_ENDPOINT_URL)"
          export S3_FORCE_PATH_STYLE="$(dotenv_value S3_FORCE_PATH_STYLE)"
          export S3_PUBLIC_BASE_URL="$(dotenv_value S3_PUBLIC_BASE_URL)"
          export AWS_REQUEST_CHECKSUM_CALCULATION="${AWS_REQUEST_CHECKSUM_CALCULATION:-when_required}"
          export AWS_RESPONSE_CHECKSUM_VALIDATION="${AWS_RESPONSE_CHECKSUM_VALIDATION:-when_required}"
          if [ -z "${S3_BUCKET:-}" ]; then
            echo "::error::S3_BUCKET missing in /data/multica/.env"
            exit 1
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY missing from aliyun-dev"
            exit 1
          fi
          echo "publishing to bucket=${S3_BUCKET} region=${S3_REGION:-} endpoint=${AWS_ENDPOINT_URL:-}"
          (cd server && go run ./cmd/publish-agent-avatars)
          for url in \
            https://cdn.leagent.me/agent-avatars/v3/agent-01.png \
            https://cdn.leagent.me/agent-avatars/v3/agent-08.png \
            https://cdn.leagent.me/agent-avatars/v3/agent-15.png; do
            echo "GET ${url}"
            curl -fsS --retry 5 --retry-delay 2 -o /tmp/avatar-check.png "$url"
            python3 - <<'PY'
          from pathlib import Path
          data = Path("/tmp/avatar-check.png").read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("downloaded object is not a PNG")
          print(f"ok bytes={len(data)}")
          PY
          done
