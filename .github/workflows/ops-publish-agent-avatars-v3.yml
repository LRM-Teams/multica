# One-shot publisher for the Botlab v3 agent avatar catalog.
# Does not deploy. Does not migrate. Delete this workflow after CDN verify.
name: ops-publish-agent-avatars-v3

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: aliyun-dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: leagent
      S3_REGION: oss-cn-beijing
      AWS_ENDPOINT_URL: https://oss-cn-beijing.aliyuncs.com
      S3_FORCE_PATH_STYLE: "false"
      S3_PUBLIC_BASE_URL: https://cdn.leagent.me
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Publish v3 catalog to OSS
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY missing from aliyun-dev"
            exit 1
          fi
          echo "publishing to bucket=${S3_BUCKET} region=${S3_REGION} endpoint=${AWS_ENDPOINT_URL}"
          (cd server && go run ./cmd/publish-agent-avatars)

      - name: Verify public CDN objects
        run: |
          set -euo pipefail
          for url in \
            https://cdn.leagent.me/agent-avatars/v3/agent-01.png \
            https://cdn.leagent.me/agent-avatars/v3/agent-08.png \
            https://cdn.leagent.me/agent-avatars/v3/agent-15.png; do
            echo "GET ${url}"
            curl -fsS --retry 5 --retry-delay 2 -o /tmp/avatar-check.png "$url"
            python3 - <<'PY'
          from pathlib import Path
          data = Path("/tmp/avatar-check.png").read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("downloaded object is not a PNG")
          print(f"ok bytes={len(data)}")
          PY
          done
