name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write
  packages: write

env:
  GHCR_OWNER: lrm-teams
  MULTICA_APP_URL: ${{ vars.MULTICA_APP_URL || 'https://www.leagent.me' }}
  MULTICA_API_URL: ${{ vars.MULTICA_API_URL || 'https://api.leagent.me' }}
  MULTICA_WS_URL: ${{ vars.MULTICA_WS_URL || 'wss://api.leagent.me/ws' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run tests
        run: cd server && go test ./...

  # The release still needs a daemon artifact for the Linux fleet and for
  # Frank's Apple-silicon machine that runs Wendy. Keep desktop installers and
  # every other cross-platform target off the Actions budget.
  release:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The CLI/daemon and install script cannot read this private repository's
  # GitHub Release assets without credentials. Publish one canonical feed to
  # the leagent OSS bucket under computer/, the exact namespace accelerated by
  # cdn.leagent.me/computer. There is deliberately no second bucket, direct OSS
  # URL, or Caddy/local-disk copy: upload, cache refresh, and consumer-visible
  # verification are one release gate.
  #
  # Archives are stored once under computer/{version}/. The small manifest is
  # also written to the previous latest.json and {tag}/release.json names so
  # already-installed daemons can cross the naming migration.
  #
  # RELEASES_OSS_* belongs to a dedicated RAM identity. Its policy must allow
  # writes only below oss://leagent/computer/ and CDN RefreshObjectCaches for
  # cdn.leagent.me. Aliyun OSS compatibility details remain documented in the
  # S3 section of .env.example.
  publish-downloads-feed:
    needs: [verify, release]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ needs.verify.outputs.tag_name }}
      IS_STABLE: ${{ needs.verify.outputs.is_stable }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_OSS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_OSS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: oss-cn-beijing
      # AWS SDK v2's default PutObject checksum encoding
      # (STREAMING-UNSIGNED-PAYLOAD-TRAILER) isn't supported by Aliyun OSS's
      # S3-compatible layer ("NotImplemented"). Same fix already documented
      # for the app's own S3-compatible attachment storage (.env.example).
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      OSS_ENDPOINT_URL: https://oss-cn-beijing.aliyuncs.com
      OSS_BUCKET: leagent
      RELEASE_PREFIX: computer
      PUBLIC_BASE_URL: https://cdn.leagent.me/computer
      ALIYUN_CLI_VERSION: 3.4.11
      ALIYUN_CLI_SHA256: a7e3df497db14c10d4d7587795e9fa7849b0c51dfce02908b9de5a41fe717d5c
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # AWS CLI defaults to path-style addressing (endpoint/bucket/key)
      # against a bare regional --endpoint-url. Aliyun OSS's S3-compatible
      # API rejects that for this bucket ("SecondLevelDomainForbidden:
      # Please use virtual hosted style to access") and requires
      # bucket.endpoint/key instead — force it globally for this job rather
      # than fighting per-command flags.
      - name: Configure AWS CLI for OSS virtual-hosted-style addressing
        run: aws configure set default.s3.addressing_style virtual

      - name: Download release archives + checksums from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-assets"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME}")"
          echo "$release_json" |
            jq -c '.assets[] | select(.name == "checksums.txt" or (.name | test("^multica-cli-.*\\.(tar\\.gz|zip)$")))' |
            while IFS= read -r asset; do
              name="$(jq -r '.name' <<<"$asset")"
              url="$(jq -r '.url' <<<"$asset")"
              echo "Downloading ${name}"
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                -o "${RUNNER_TEMP}/release-assets/${name}" \
                "$url"
            done
          test -f "${RUNNER_TEMP}/release-assets/checksums.txt"
          ls -la "${RUNNER_TEMP}/release-assets"

      - name: Build release manifest
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          bash scripts/publish-release-manifest.sh \
            "${TAG_NAME}" "${version}" \
            "${PUBLIC_BASE_URL}/${version}" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" \
            "${RUNNER_TEMP}/release-assets" \
            >"${RUNNER_TEMP}/manifest.json"
          cat "${RUNNER_TEMP}/manifest.json"

      - name: Publish immutable per-version objects
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          canonical_prefix="${RELEASE_PREFIX}/${version}"
          legacy_prefix="${RELEASE_PREFIX}/${TAG_NAME}"
          for key in "${canonical_prefix}/manifest.json" "${legacy_prefix}/release.json"; do
            if aws s3api head-object \
              --endpoint-url "$OSS_ENDPOINT_URL" --bucket "$OSS_BUCKET" --key "$key" \
              >/dev/null 2>&1; then
              echo "::error title=Immutable release object already exists::s3://${OSS_BUCKET}/${key}"
              exit 1
            fi
          done
          shopt -s nullglob
          for f in "${RUNNER_TEMP}/release-assets"/multica-cli-*.tar.gz "${RUNNER_TEMP}/release-assets"/multica-cli-*.zip; do
            aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
              --cache-control "public,max-age=31536000,immutable" \
              "$f" "s3://${OSS_BUCKET}/${canonical_prefix}/$(basename "$f")"
          done
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
            --cache-control "public,max-age=31536000,immutable" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" "s3://${OSS_BUCKET}/${canonical_prefix}/checksums.txt"
          for destination in "${canonical_prefix}/manifest.json" "${legacy_prefix}/release.json"; do
            aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
              --cache-control "public,max-age=31536000,immutable" \
              "${RUNNER_TEMP}/manifest.json" "s3://${OSS_BUCKET}/${destination}"
          done
          echo "Published canonical release objects: s3://${OSS_BUCKET}/${canonical_prefix}/"
          echo "Published legacy manifest alias: s3://${OSS_BUCKET}/${legacy_prefix}/release.json"

      - name: Publish install scripts + docs (stable path, not per-version)
        run: |
          set -euo pipefail
          for file in scripts/install.sh scripts/install.ps1 CLI_INSTALL.md; do
            aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
              --cache-control "no-cache,max-age=0,must-revalidate" \
              "$file" "s3://${OSS_BUCKET}/${RELEASE_PREFIX}/$(basename "$file")"
          done

      - name: Promote release manifest
        if: env.IS_STABLE == 'true'
        run: |
          set -euo pipefail
          for name in manifest.json latest.json; do
            aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
              --cache-control "no-cache,max-age=0,must-revalidate" \
              "${RUNNER_TEMP}/manifest.json" "s3://${OSS_BUCKET}/${RELEASE_PREFIX}/${name}"
          done
          echo "Promoted ${TAG_NAME} to the canonical and legacy release manifests"

      - name: Install pinned Aliyun CLI
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/aliyun-cli.tgz"
          curl -fsSL \
            "https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz" \
            -o "$archive"
          printf '%s  %s\n' "$ALIYUN_CLI_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/aliyun-cli" "${RUNNER_TEMP}/bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/aliyun-cli"
          install -m 0755 "${RUNNER_TEMP}/aliyun-cli/aliyun" "${RUNNER_TEMP}/bin/aliyun"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Refresh CDN objects
        env:
          CDN_ACCESS_KEY_ID: ${{ secrets.RELEASES_OSS_ACCESS_KEY_ID }}
          CDN_ACCESS_KEY_SECRET: ${{ secrets.RELEASES_OSS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          config="${RUNNER_TEMP}/aliyun-config.json"
          aliyun configure set \
            --config-path "$config" \
            --mode AK \
            --region cn-hangzhou \
            --access-key-id "$CDN_ACCESS_KEY_ID" \
            --access-key-secret "$CDN_ACCESS_KEY_SECRET"
          version="${TAG_NAME#v}"
          printf -v object_paths '%s\n%s\n%s\n%s\n%s' \
            "${PUBLIC_BASE_URL}/install.sh" \
            "${PUBLIC_BASE_URL}/install.ps1" \
            "${PUBLIC_BASE_URL}/CLI_INSTALL.md" \
            "${PUBLIC_BASE_URL}/${version}/manifest.json" \
            "${PUBLIC_BASE_URL}/${TAG_NAME}/release.json"
          if [ "$IS_STABLE" = "true" ]; then
            object_paths+=$'\n'"${PUBLIC_BASE_URL}/manifest.json"
            object_paths+=$'\n'"${PUBLIC_BASE_URL}/latest.json"
          fi
          aliyun --config-path "$config" \
            cdn RefreshObjectCaches \
            --ObjectType File \
            --ObjectPath "$object_paths"

      # Verify the consumer-facing CDN, not the OSS API or bucket domain. The
      # retry absorbs propagation after RefreshObjectCaches; exhausting it is
      # a release failure, never a warning.
      - name: Verify the published feed through the public CDN
        run: |
          set -euo pipefail
          verify_matches() {
            local url="$1" want_file="$2" label="$3"
            local got_file attempt
            got_file="$(mktemp)"
            for attempt in $(seq 1 12); do
              if curl -fsSL "$url" -o "$got_file" && cmp -s "$want_file" "$got_file"; then
                rm -f "$got_file"
                return 0
              fi
              echo "Waiting for CDN propagation: ${label} (${attempt}/12)"
              sleep 5
            done
            rm -f "$got_file"
            echo "::error title=CDN object does not match uploaded content::${label} (${url})"
            exit 1
          }
          version="${TAG_NAME#v}"
          verify_matches "${PUBLIC_BASE_URL}/${version}/checksums.txt" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" "checksums.txt"
          verify_matches "${PUBLIC_BASE_URL}/${version}/manifest.json" \
            "${RUNNER_TEMP}/manifest.json" "canonical version manifest"
          verify_matches "${PUBLIC_BASE_URL}/${TAG_NAME}/release.json" \
            "${RUNNER_TEMP}/manifest.json" "legacy version manifest"
          if [ "$IS_STABLE" = "true" ]; then
            verify_matches "${PUBLIC_BASE_URL}/manifest.json" \
              "${RUNNER_TEMP}/manifest.json" "canonical promoted manifest"
            verify_matches "${PUBLIC_BASE_URL}/latest.json" \
              "${RUNNER_TEMP}/manifest.json" "legacy promoted manifest"
          fi
          echo "Verified: public CDN bytes match the canonical release feed."

  # The web-only release policy publishes Linux amd64 images only. The served
  # deployment target is amd64. Daemon archives are handled by the release job
  # above for Linux amd64 and Wendy's Darwin arm64 host only.
  docker-backend-build:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    # One mutable cache head per image/platform; serialize tag releases so two
    # writers cannot overwrite the same registry cache concurrently.
    concurrency:
      group: release-docker-backend-cache-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-backend
          labels: |
            org.opencontainers.image.title=Multica Backend
            org.opencontainers.image.description=Multica self-hosted backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry caches are ref-independent. Prefer the release lane and
          # fall back to dev for the first release cache seed. GHCR is free
          # under GitHub's 2026-07 policy; re-evaluate if that policy changes.
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:buildcache-release-${{ env.PLATFORM_PAIR }}
            type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:buildcache-dev-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:buildcache-release-${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            VERSION=${{ needs.verify.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [verify, docker-backend-build]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.GHCR_OWNER }}/multica-backend@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:${{ steps.meta.outputs.version }}

  docker-web-build:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    # One mutable cache head per image/platform; serialize tag releases so two
    # writers cannot overwrite the same registry cache concurrently.
    concurrency:
      group: release-docker-web-cache-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-web
          labels: |
            org.opencontainers.image.title=Multica Web
            org.opencontainers.image.description=Multica self-hosted web frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry caches are ref-independent. Prefer the release lane and
          # fall back to dev for the first release cache seed.
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-web:buildcache-release-${{ env.PLATFORM_PAIR }}
            type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-web:buildcache-dev-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-web:buildcache-release-${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_URL=${{ env.MULTICA_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ env.MULTICA_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.MULTICA_WS_URL }}
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.tag_name }}
          outputs: type=image,name=ghcr.io/${{ env.GHCR_OWNER }}/multica-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [verify, docker-web-build]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.GHCR_OWNER }}/multica-web@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ env.GHCR_OWNER }}/multica-web:${{ steps.meta.outputs.version }}

  helm-chart:
    needs: [verify, docker-backend-merge, docker-web-merge]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-helm-chart-${{ github.ref }}
      cancel-in-progress: true
    env:
      CHART_DIR: deploy/helm/multica
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Sync chart metadata with release tag
        env:
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          chart_version="${TAG_NAME#v}"
          sed -i -E "s/^version:.*/version: ${chart_version}/" "$CHART_DIR/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${TAG_NAME}\"/" "$CHART_DIR/Chart.yaml"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Configure OCI registry
        run: echo "OCI_REGISTRY=oci://ghcr.io/${GHCR_OWNER}/charts" >> "$GITHUB_ENV"

      - name: Push chart to GHCR
        run: helm push ".chart-packages/multica-${CHART_VERSION}.tgz" "$OCI_REGISTRY"

      - name: Verify published chart
        run: helm show chart "$OCI_REGISTRY/multica" --version "$CHART_VERSION"
