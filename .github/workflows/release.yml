name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write
  packages: write

env:
  GHCR_OWNER: lrm-teams

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run tests
        run: cd server && go test ./...

  # The release still needs a daemon artifact for the Linux fleet and for
  # Frank's Apple-silicon machine that runs Wendy. Keep desktop installers and
  # every other cross-platform target off the Actions budget.
  release:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The CLI/daemon and install script cannot read GitHub Releases themselves:
  # an unauthenticated request to the private LRM-Teams/multica repo's API or
  # asset host always 404s (no credential the CLI/daemon binary can carry).
  # This job re-publishes the same GoReleaser archives, plus a manifest CI
  # derives from checksums.txt, to an Aliyun OSS bucket that Caddy
  # 302-redirects /downloads/multica/* to (deploy/aliyun/Caddyfile
  # RELEASES_PUBLIC_ORIGIN). It only reads from the just-created GitHub
  # release with the CI token; it never touches the deploy host or a running
  # container — a plain hosted runner is enough, unlike the local-filesystem
  # design this replaced.
  #
  # Credentials are a narrowly-scoped OSS sub-account (write access to the
  # releases/ prefix only) — deliberately separate from the app's own
  # S3_BUCKET/AWS_ACCESS_KEY_ID attachment-storage secrets, so a compromised
  # release key can only ever overwrite published CLI archives, never touch
  # user attachments in the app's bucket.
  publish-downloads-feed:
    needs: [verify, release]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MANIFEST_BASE_URL: https://leagent.me/downloads/multica
      TAG_NAME: ${{ needs.verify.outputs.tag_name }}
      IS_STABLE: ${{ needs.verify.outputs.is_stable }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_OSS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_OSS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.RELEASES_OSS_REGION }}
      OSS_ENDPOINT_URL: ${{ secrets.RELEASES_OSS_ENDPOINT_URL }}
      OSS_BUCKET: ${{ secrets.RELEASES_OSS_BUCKET }}
      # Public HTTPS base URL objects are readable at — must be the exact
      # value deploy/aliyun/Caddyfile's RELEASES_PUBLIC_ORIGIN redirects to,
      # kept as one value here rather than derived, since bucket-domain
      # construction rules vary by provider/CDN and a mismatch would silently
      # break every install/update until someone diffs the two.
      OSS_PUBLIC_BASE_URL: ${{ secrets.RELEASES_OSS_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release archives + checksums from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-assets"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME}")"
          echo "$release_json" |
            jq -c '.assets[] | select(.name == "checksums.txt" or (.name | test("^multica-cli-.*\\.(tar\\.gz|zip)$")))' |
            while IFS= read -r asset; do
              name="$(jq -r '.name' <<<"$asset")"
              url="$(jq -r '.url' <<<"$asset")"
              echo "Downloading ${name}"
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                -o "${RUNNER_TEMP}/release-assets/${name}" \
                "$url"
            done
          test -f "${RUNNER_TEMP}/release-assets/checksums.txt"
          ls -la "${RUNNER_TEMP}/release-assets"

      - name: Build release manifest
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          bash scripts/publish-release-manifest.sh \
            "${TAG_NAME}" "${version}" \
            "${MANIFEST_BASE_URL}/${TAG_NAME}" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" \
            "${RUNNER_TEMP}/release-assets" \
            >"${RUNNER_TEMP}/release.json"
          cat "${RUNNER_TEMP}/release.json"

      - name: Publish immutable per-version objects
        run: |
          set -euo pipefail
          prefix="releases/${TAG_NAME}"
          # A single object PUT is atomic; there is no local staging/rename
          # step to get right (unlike the filesystem design this replaced) —
          # but we still refuse to silently overwrite an already-published
          # immutable version.
          if aws s3api head-object \
            --endpoint-url "$OSS_ENDPOINT_URL" --bucket "$OSS_BUCKET" --key "${prefix}/release.json" \
            >/dev/null 2>&1; then
            echo "::error title=Immutable release object already exists::s3://${OSS_BUCKET}/${prefix}/release.json"
            exit 1
          fi
          shopt -s nullglob
          for f in "${RUNNER_TEMP}/release-assets"/multica-cli-*.tar.gz "${RUNNER_TEMP}/release-assets"/multica-cli-*.zip; do
            aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" "$f" "s3://${OSS_BUCKET}/${prefix}/$(basename "$f")"
          done
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" "s3://${OSS_BUCKET}/${prefix}/checksums.txt"
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
            "${RUNNER_TEMP}/release.json" "s3://${OSS_BUCKET}/${prefix}/release.json"
          echo "Published immutable release objects: s3://${OSS_BUCKET}/${prefix}/"

      - name: Publish install scripts + docs (stable path, not per-version)
        run: |
          set -euo pipefail
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" scripts/install.sh "s3://${OSS_BUCKET}/releases/install.sh"
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" scripts/install.ps1 "s3://${OSS_BUCKET}/releases/install.ps1"
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" CLI_INSTALL.md "s3://${OSS_BUCKET}/releases/CLI_INSTALL.md"

      - name: Promote latest.json
        if: env.IS_STABLE == 'true'
        run: |
          set -euo pipefail
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" "${RUNNER_TEMP}/release.json" "s3://${OSS_BUCKET}/releases/latest.json"
          echo "Promoted ${TAG_NAME} to s3://${OSS_BUCKET}/releases/latest.json"

      # "Upload succeeded" is not "installable" — task #187 was exactly this
      # shape (update request 200, nothing actually changed) and #15's s144
      # incident was a silent-404 variant of the same failure. Prove the
      # published bytes are the same bytes a real install/update would fetch
      # over HTTPS, not just that the OSS API accepted the PUT.
      - name: Verify the published feed is actually publicly downloadable
        run: |
          set -euo pipefail
          verify_matches() {
            local url="$1" want_file="$2" label="$3"
            local got_file
            got_file="$(mktemp)"
            curl -fsSL "$url" -o "$got_file"
            if ! cmp -s "$want_file" "$got_file"; then
              echo "::error title=Published object does not match uploaded content::${label} (${url})"
              exit 1
            fi
            rm -f "$got_file"
          }
          verify_matches "${OSS_PUBLIC_BASE_URL}/${TAG_NAME}/checksums.txt" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" "checksums.txt"
          verify_matches "${OSS_PUBLIC_BASE_URL}/${TAG_NAME}/release.json" \
            "${RUNNER_TEMP}/release.json" "release.json"
          if [ "$IS_STABLE" = "true" ]; then
            verify_matches "${OSS_PUBLIC_BASE_URL}/latest.json" \
              "${RUNNER_TEMP}/release.json" "latest.json"
          fi
          echo "Verified: published objects are byte-identical when re-downloaded over HTTPS from the public feed."

  # The web-only release policy publishes Linux amd64 images only. The served
  # deployment target is amd64. Daemon archives are handled by the release job
  # above for Linux amd64 and Wendy's Darwin arm64 host only.
  docker-backend-build:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-backend
          labels: |
            org.opencontainers.image.title=Multica Backend
            org.opencontainers.image.description=Multica self-hosted backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read-only: read from the deploy-backend cache warmed by dev builds.
          # Do not write here — a tag ref never rebuilds, so any cache-to on a
          # release build is dead weight from the moment this job finishes; it
          # was filling the repo's 10GB Actions cache quota and evicting the
          # actively-reused dev/turbo caches (see task #18).
          cache-from: type=gha,scope=deploy-backend
          build-args: |
            VERSION=${{ needs.verify.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [verify, docker-backend-build]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.GHCR_OWNER }}/multica-backend@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:${{ steps.meta.outputs.version }}

  docker-web-build:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-web
          labels: |
            org.opencontainers.image.title=Multica Web
            org.opencontainers.image.description=Multica self-hosted web frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read-only: read from the deploy-web cache warmed by dev builds.
          # Do not write here — a tag ref never rebuilds, so any cache-to on a
          # release build is dead weight from the moment this job finishes; it
          # was filling the repo's 10GB Actions cache quota and evicting the
          # actively-reused dev/turbo caches (see task #18).
          cache-from: type=gha,scope=deploy-web
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.tag_name }}
          outputs: type=image,name=ghcr.io/${{ env.GHCR_OWNER }}/multica-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [verify, docker-web-build]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.GHCR_OWNER }}/multica-web@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ env.GHCR_OWNER }}/multica-web:${{ steps.meta.outputs.version }}

  helm-chart:
    needs: [verify, docker-backend-merge, docker-web-merge]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-helm-chart-${{ github.ref }}
      cancel-in-progress: true
    env:
      CHART_DIR: deploy/helm/multica
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Sync chart metadata with release tag
        env:
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          chart_version="${TAG_NAME#v}"
          sed -i -E "s/^version:.*/version: ${chart_version}/" "$CHART_DIR/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${TAG_NAME}\"/" "$CHART_DIR/Chart.yaml"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Configure OCI registry
        run: echo "OCI_REGISTRY=oci://ghcr.io/${GHCR_OWNER}/charts" >> "$GITHUB_ENV"

      - name: Push chart to GHCR
        run: helm push ".chart-packages/multica-${CHART_VERSION}.tgz" "$OCI_REGISTRY"

      - name: Verify published chart
        run: helm show chart "$OCI_REGISTRY/multica" --version "$CHART_VERSION"
