<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">LRM-1309 画布节点四内容面实施标注</title>
  <desc id="desc">当前节点仅有标题和状态；目标方案在桌面节点、窄屏列表和详情 Sheet 中展示目标、操作思路、调研思路和调研结果四内容面。</desc>
  <defs>
    <style>
      .page{fill:#f6f6f4}.panel{fill:#fff;stroke:#d1d1d1;stroke-width:1.5}.card{fill:#fff;stroke:#d1d1d1;stroke-width:1.5}.dark{fill:#1e1e1e;stroke:#565656;stroke-width:1.5}.ink{fill:#1d1c1d;font-family:Arial,'Noto Sans SC',sans-serif}.muted{fill:#616061;font-family:Arial,'Noto Sans SC',sans-serif}.light{fill:#f5f5f5;font-family:Arial,'Noto Sans SC',sans-serif}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.title{font-size:25px;font-weight:700}.heading{font-size:20px;font-weight:700}.label{font-size:11px;font-weight:700;letter-spacing:.6px}.value{font-size:14px;font-weight:600}.note{font-size:13px}.line{stroke:#1264a3;stroke-width:2;fill:none}.dash{stroke:#868686;stroke-width:1.5;stroke-dasharray:5 5;fill:none}.cell{fill:#f8f8f8;stroke:#e8e8e8;stroke-width:1}.cell-dark{fill:#292929;stroke:#505050;stroke-width:1}.chip-run{fill:#e8f5fa}.chip-ok{fill:#e6f4ef}.chip-neutral{fill:#f1f1f1}.chip-danger{fill:#fae8ef}.blue{fill:#1264a3}.green{fill:#007a5a}.red{fill:#e01e5a}.amber{fill:#b35c00}.darkink{fill:#f8f8f8;font-family:Arial,'Noto Sans SC',sans-serif}.darkmuted{fill:#c6c6c6;font-family:Arial,'Noto Sans SC',sans-serif}
    </style>
  </defs>
  <rect class="page" width="1600" height="1120"/>
  <text x="64" y="58" class="ink title">LRM-1309 · 画布节点四内容面（设计门）</text>
  <text x="64" y="87" class="muted body">节点不是日志卡：表面四段可扫读，完整内容在详情；质量态、废弃态、布局与动效仍由各自轨道拥有。</text>

  <rect x="64" y="128" width="500" height="446" rx="18" class="panel"/>
  <text x="96" y="172" class="red heading">BEFORE · 现在的表面</text>
  <text x="96" y="198" class="muted small">240 × 68–88 · 只有标题、状态、负责人、阶段</text>
  <rect x="132" y="252" width="300" height="104" rx="12" class="card"/>
  <circle cx="120" cy="304" r="8" fill="#0f766e"/><path d="M84 304H112" class="line"/>
  <text x="156" y="284" class="ink body" font-weight="700">价格区间已交叉验证</text>
  <rect x="156" y="301" width="60" height="22" rx="11" class="chip-ok"/><text x="166" y="317" class="green tiny">已完成</text>
  <text x="230" y="317" class="muted tiny">研究员A · 验证 · 2m</text>
  <text x="96" y="402" class="muted note">✕ 看不到目标、操作、调研思路或结果</text>
  <text x="96" y="430" class="muted note">✕ summary 不能被误当成四个内容面的替代</text>
  <path d="M96 462H508" class="dash"/>
  <text x="96" y="494" class="ink small" font-weight="700">诊断</text>
  <text x="96" y="520" class="muted note">用户只能猜“这个节点在做什么”，无法比较分支</text>
  <text x="96" y="542" class="muted note">也无法分辨「还没形成结果」和「没有返回字段」</text>

  <rect x="600" y="128" width="936" height="446" rx="18" class="panel"/>
  <text x="632" y="172" class="green heading">AFTER · 桌面节点（≥768）</text>
  <text x="632" y="198" class="muted small">宽 240–260px / 高 112–124px；不改变 gutter、port、菜单或节点拓扑</text>
  <path d="M684 350H754" class="line"/><circle cx="768" cy="350" r="8" fill="#0f766e"/>
  <rect x="780" y="244" width="430" height="260" rx="14" class="card"/>
  <text x="804" y="278" class="ink body" font-weight="700">价格区间已交叉验证</text>
  <text x="1166" y="278" class="muted body">⋯</text>
  <rect x="804" y="296" width="184" height="74" rx="8" class="cell"/>
  <text x="816" y="318" class="muted label">目标</text><text x="816" y="346" class="ink value">确认可用价格区间</text>
  <rect x="1002" y="296" width="184" height="74" rx="8" class="cell"/>
  <text x="1014" y="318" class="muted label">操作思路</text><text x="1014" y="346" class="ink value">抽样并交叉验证</text>
  <rect x="804" y="382" width="184" height="74" rx="8" class="cell"/>
  <text x="816" y="404" class="muted label">调研思路</text><text x="816" y="432" class="ink value">比较挂牌与成交</text>
  <rect x="1002" y="382" width="184" height="74" rx="8" class="cell"/>
  <text x="1014" y="404" class="muted label">调研结果</text><text x="1014" y="432" class="ink value">中位差约 8%</text>
  <rect x="804" y="470" width="60" height="20" rx="10" class="chip-ok"/><text x="814" y="485" class="green tiny">已完成</text>
  <text x="876" y="485" class="muted tiny">可信 · 研究员A · 验证</text>
  <path d="M1230 304H1420" class="dash"/><text x="1240" y="292" class="ink note" font-weight="700">表面规则</text>
  <text x="1240" y="322" class="muted note">• 四 label 永远可见</text><text x="1240" y="348" class="muted note">• 每格仅 1 行短值</text><text x="1240" y="374" class="muted note">• CSS clamp，不做 JS 猜截断</text><text x="1240" y="400" class="muted note">• 状态/质量与内容语义分离</text>
  <text x="632" y="540" class="muted note">连线和端口永远在 gutter 装饰层；卡片内容边界右侧不被线穿过。标题、状态、选中和既有按钮仍可键盘访问。</text>

  <rect x="64" y="610" width="904" height="448" rx="18" class="panel"/>
  <text x="96" y="654" class="ink heading">窄屏真实表面（&lt;768）与详情 Sheet</text>
  <text x="96" y="680" class="muted small">不是缩小自由画布：保留 Git gutter + 单列四行卡；点击打开完整 Sheet</text>
  <rect x="120" y="724" width="350" height="286" rx="16" fill="#f1f1f1" stroke="#d1d1d1"/>
  <rect x="142" y="752" width="18" height="220" rx="9" fill="#0f766e" opacity=".8"/>
  <circle cx="151" cy="784" r="7" fill="#fff" stroke="#0f766e" stroke-width="3"/>
  <rect x="184" y="738" width="254" height="246" rx="12" class="card"/>
  <text x="202" y="768" class="ink small" font-weight="700">价格区间已交叉验证</text><text x="406" y="768" class="muted small">⋯</text>
  <text x="202" y="802" class="muted label">目标</text><text x="282" y="802" class="ink small">确认可用价格区间</text>
  <path d="M202 815H420" stroke="#e8e8e8"/>
  <text x="202" y="838" class="muted label">操作思路</text><text x="282" y="838" class="ink small">抽样并交叉验证</text>
  <path d="M202 851H420" stroke="#e8e8e8"/>
  <text x="202" y="874" class="muted label">调研思路</text><text x="282" y="874" class="ink small">比较挂牌与成交</text>
  <path d="M202 887H420" stroke="#e8e8e8"/>
  <text x="202" y="910" class="muted label">调研结果</text><text x="282" y="910" class="ink small">中位差约 8%</text>
  <rect x="202" y="932" width="60" height="20" rx="10" class="chip-ok"/><text x="212" y="947" class="green tiny">已完成</text>
  <rect x="522" y="724" width="392" height="286" rx="18" class="dark"/>
  <rect x="522" y="724" width="392" height="32" rx="18" fill="#343434"/><rect x="522" y="742" width="392" height="14" fill="#343434"/>
  <text x="548" y="780" class="darkink body" font-weight="700">节点详情</text><text x="868" y="780" class="darkmuted body">×</text>
  <text x="548" y="818" class="darkmuted label">目标</text><text x="548" y="842" class="darkink small">确认可用价格区间，并形成可复查范围。</text>
  <text x="548" y="872" class="darkmuted label">操作思路</text><text x="548" y="896" class="darkink small">抽样后以独立来源交叉验证。</text>
  <text x="548" y="926" class="darkmuted label">调研思路</text><text x="548" y="950" class="darkink small">比较挂牌与成交价以排除单一信源偏差。</text>
  <text x="548" y="980" class="darkmuted label">调研结果</text><text x="548" y="1004" class="darkink small">中位差约 8%，证据见下方既有来源区。</text>

  <rect x="1004" y="610" width="532" height="448" rx="18" class="panel"/>
  <text x="1036" y="654" class="ink heading">状态与验收红线</text>
  <rect x="1036" y="694" width="210" height="90" rx="10" class="cell"/><text x="1052" y="720" class="ink small" font-weight="700">进行中 + result 缺失</text><text x="1052" y="748" class="muted note">调研结果 · 结果整理中</text><text x="1052" y="770" class="blue note">aria-busy=true；不编结论</text>
  <rect x="1260" y="694" width="244" height="90" rx="10" class="cell"/><text x="1276" y="720" class="ink small" font-weight="700">单字段缺失</text><text x="1276" y="748" class="muted note">该格 · 未提供</text><text x="1276" y="770" class="amber note">不可用 summary/status 兜底</text>
  <rect x="1036" y="802" width="210" height="90" rx="10" class="cell"/><text x="1052" y="828" class="ink small" font-weight="700">failed / unknown</text><text x="1052" y="856" class="muted note">本轮未产出可展示结果</text><text x="1052" y="878" class="red note">不显示内部 error 或任务码</text>
  <rect x="1260" y="802" width="244" height="90" rx="10" class="cell"/><text x="1276" y="828" class="ink small" font-weight="700">abandoned + detour</text><text x="1276" y="856" class="muted note">废弃原因来自 LRM-1317</text><text x="1276" y="878" class="red note">LRM-1315 定义外观，非本刀</text>
  <path d="M1036 924H1504" class="dash"/>
  <text x="1036" y="956" class="ink small" font-weight="700">必须通过</text>
  <text x="1036" y="982" class="muted note">亮/暗 · 1440 + 360/700/767/768 · fullPage；四 label、无横滚、一个主 button、详情四 heading。</text>
  <text x="1036" y="1010" class="muted note">tokens 仅用 card/foreground/muted/border + 既有语义色；不加裸 hex，不把 branch 色当状态。</text>
  <text x="1036" y="1036" class="muted note">设计门前不启动 FE；字段以 LRM-1317 为唯一事实源，布局高度协商由 LRM-1295 接手。</text>
</svg>
