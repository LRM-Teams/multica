{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $samplerQueryNames := "active_users|active_workspaces|task_queued|task_running|task_stuck|runtime_online|runtime_heartbeat_age|workspace_total" -}}
{{- $samplerErrorNames := printf "acquire|%s" $samplerQueryNames -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "multica.backend.fullname" . }}-sampler
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: multica-business-sampler
      rules:
        - alert: MulticaBusinessSamplerQueryErrors
          expr: |
            sum by (name) (
              rate(multica_business_sampler_query_errors_total{name=~"{{ $samplerErrorNames }}"}[10m])
            ) > 0
          for: {{ .Values.monitoring.prometheusRule.samplerQueryErrorsFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Business sampler query errors"
            description: "Business sampler query {{ "{{ $labels.name }}" }} is returning errors. Metrics may go stale if the query keeps timing out."
        - alert: MulticaBusinessSamplerQueryLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, name) (
                rate(multica_business_sampler_query_seconds_bucket{name=~"{{ $samplerQueryNames }}"}[10m])
              )
            ) > 0.3
          for: {{ .Values.monitoring.prometheusRule.samplerQueryLatencyFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Business sampler query p95 is high"
            description: "Business sampler query {{ "{{ $labels.name }}" }} p95 is above 300ms, leaving little headroom before the 500ms statement_timeout."
        - alert: MulticaFreshnessHoldResolutionSlow
          expr: |
            (
              sum by (outcome) (
                increase(multica_freshness_hold_resolution_seconds_count[5m])
              )
              -
              sum by (outcome) (
                increase(multica_freshness_hold_resolution_seconds_bucket{le="30"}[5m])
              )
            ) > 0
          for: {{ .Values.monitoring.prometheusRule.freshnessHoldResolutionFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Freshness hold resolution exceeded 30 seconds"
            description: "A freshness hold resolved after more than 30 seconds with outcome {{ "{{ $labels.outcome }}" }}."

    - name: multica-http-request-slo
      rules:
        # Frank SLO: every served API p95 < 1s. Quantile over 5m rate window.
        # priority=hot_path for activity + agent-task-snapshot (accident paths).
        - alert: MulticaHTTPRequestP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, method, route) (
                rate(multica_http_request_duration_seconds_bucket[5m])
              )
            ) > {{ .Values.monitoring.prometheusRule.httpP95Seconds | default 1 }}
          for: {{ .Values.monitoring.prometheusRule.httpP95For | default "2m" | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
            slo: http_request_p95
          annotations:
            summary: "HTTP served p95 above SLO"
            description: "served p95 for {{ "{{ $labels.method }}" }} {{ "{{ $labels.route }}" }} is above {{ .Values.monitoring.prometheusRule.httpP95Seconds | default 1 }}s (Frank gate: every API < 1s). Not SQL time — middleware wall clock."
        - alert: MulticaHTTPRequestP95HighHotPath
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, method, route) (
                rate(multica_http_request_duration_seconds_bucket{
                  route=~"/api/agents/\\{id\\}/activity|/api/agent-task-snapshot"
                }[5m])
              )
            ) > {{ .Values.monitoring.prometheusRule.httpP95Seconds | default 1 }}
          for: {{ .Values.monitoring.prometheusRule.httpP95For | default "2m" | quote }}
          labels:
            severity: critical
            slo: http_request_p95
            priority: hot_path
          annotations:
            summary: "Hot-path HTTP served p95 above SLO"
            description: "activity or agent-task-snapshot served p95 is above {{ .Values.monitoring.prometheusRule.httpP95Seconds | default 1 }}s. These were the accident amplifiers."

{{- end }}
