# Tencent s89 test overlay. The test stack is isolated by Compose project name
# `multica-test`; it never shares containers or volumes with production.
services:
  postgres:
    volumes: !override
      - /data/multica-test/postgres:/var/lib/postgresql/data

  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes: !override
      - /data/multica-test/uploads:/app/data/uploads
    environment:
      APP_ENV: test
      ANALYTICS_ENVIRONMENT: staging
      FRONTEND_ORIGIN: ${MULTICA_APP_URL:-https://82.157.184.89}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-https://82.157.184.89}
      MULTICA_PUBLIC_URL: ${MULTICA_API_URL:-https://82.157.184.89}
      CORS_ALLOWED_ORIGINS: ${MULTICA_CORS_ALLOWED_ORIGINS:-https://82.157.184.89}
      COOKIE_DOMAIN: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      MULTICA_DEV_AGENT_PROFILE_ACCESS: "true"

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2.11.3@sha256:ec18ee54aab3315c22e25f3b2babda73ff8007d39b13b3bd1bfffa2f0444c7d9
    container_name: multica-test-caddy
    depends_on:
      - frontend
      - backend
    environment:
      MULTICA_TEST_HOST: ${MULTICA_TEST_HOST:-82.157.184.89}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
      - "0.0.0.0:8090:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/multica-test/caddy-data:/data
      - /data/multica-test/caddy-config:/config
    restart: unless-stopped
