[pytest]
testpaths = tests
markers =
    e2e: end-to-end tests against the shared multica deployment (requires env vars, see .env.example)
# Default runs stay hermetic: unit tests only. The `e2e` marker must be
# requested explicitly (`pytest -m e2e`); a command-line -m overrides this.
addopts = -m "not e2e"
