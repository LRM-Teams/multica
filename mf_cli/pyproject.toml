[project]
name = "mf-cli"
version = "0.1.0"
description = "Modelfactory CLI — manage inference services from the command line"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.61",
]

[project.scripts]
mf = "mf_cli.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mf_cli*"]
