name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write
  packages: write

env:
  GHCR_OWNER: lrm-teams

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run tests
        run: cd server && go test ./...

  # The release still needs a daemon artifact for the Linux fleet and for
  # Frank's Apple-silicon machine that runs Wendy. Keep desktop installers and
  # every other cross-platform target off the Actions budget.
  release:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The CLI/daemon and install script cannot read GitHub Releases themselves:
  # an unauthenticated request to the private LRM-Teams/multica repo's API or
  # asset host always 404s (no credential the CLI/daemon binary can carry).
  # This job re-publishes the same GoReleaser archives, plus a manifest CI
  # derives from checksums.txt, to a public read-only path on the Aliyun host
  # that Caddy serves on its own subdomain, cdn.leagent.me/computer/*
  # (deploy/aliyun/Caddyfile). It only reads from the just-created GitHub
  # release with the CI token and
  # writes to /data/multica/releases — it never touches /data/multica broadly
  # (the app's .env, database, etc.) and never mutates a running container.
  publish-downloads-feed:
    needs: [verify, release]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUNNER_EXPECTED_USER: dev
      RELEASES_DIR: /data/multica/releases
      MANIFEST_BASE_URL: https://cdn.leagent.me/computer
      TAG_NAME: ${{ needs.verify.outputs.tag_name }}
      IS_STABLE: ${{ needs.verify.outputs.is_stable }}
    steps:
      - name: Preflight runner identity
        run: |
          set -euo pipefail
          actual_user="$(id -un)"
          if [ "$actual_user" != "$RUNNER_EXPECTED_USER" ]; then
            echo "::error title=Unexpected runner identity::expected=${RUNNER_EXPECTED_USER} actual=${actual_user}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release archives + checksums from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-assets"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME}")"
          echo "$release_json" |
            jq -c '.assets[] | select(.name == "checksums.txt" or (.name | test("^multica-cli-.*\\.(tar\\.gz|zip)$")))' |
            while IFS= read -r asset; do
              name="$(jq -r '.name' <<<"$asset")"
              url="$(jq -r '.url' <<<"$asset")"
              echo "Downloading ${name}"
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                -o "${RUNNER_TEMP}/release-assets/${name}" \
                "$url"
            done
          test -f "${RUNNER_TEMP}/release-assets/checksums.txt"
          ls -la "${RUNNER_TEMP}/release-assets"

      - name: Build release manifest
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          bash scripts/publish-release-manifest.sh \
            "${TAG_NAME}" "${version}" \
            "${MANIFEST_BASE_URL}/${TAG_NAME}" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" \
            "${RUNNER_TEMP}/release-assets" \
            >"${RUNNER_TEMP}/release.json"
          cat "${RUNNER_TEMP}/release.json"

      - name: Prepare releases directory
        run: install -d -m 0755 "${RELEASES_DIR}"

      - name: Publish immutable per-version directory
        run: |
          set -euo pipefail
          version_dir="${RELEASES_DIR}/${TAG_NAME}"
          if [ -e "$version_dir" ]; then
            echo "::error title=Immutable release directory already exists::${version_dir}"
            exit 1
          fi
          staging_dir="$(mktemp -d "${RELEASES_DIR}/.staging-${TAG_NAME}-XXXXXX")"
          shopt -s nullglob
          for f in "${RUNNER_TEMP}/release-assets"/multica-cli-*.tar.gz "${RUNNER_TEMP}/release-assets"/multica-cli-*.zip; do
            install -m 0644 "$f" "$staging_dir/"
          done
          install -m 0644 "${RUNNER_TEMP}/release-assets/checksums.txt" "$staging_dir/checksums.txt"
          install -m 0644 "${RUNNER_TEMP}/release.json" "$staging_dir/release.json"
          mv -T "$staging_dir" "$version_dir"
          echo "Published immutable release directory: $version_dir"

      - name: Publish install scripts + docs (stable path, not per-version)
        run: |
          set -euo pipefail
          install -m 0755 scripts/install.sh "${RELEASES_DIR}/install.sh.next"
          mv -f "${RELEASES_DIR}/install.sh.next" "${RELEASES_DIR}/install.sh"
          install -m 0755 scripts/install.ps1 "${RELEASES_DIR}/install.ps1.next"
          mv -f "${RELEASES_DIR}/install.ps1.next" "${RELEASES_DIR}/install.ps1"
          install -m 0644 CLI_INSTALL.md "${RELEASES_DIR}/CLI_INSTALL.md.next"
          mv -f "${RELEASES_DIR}/CLI_INSTALL.md.next" "${RELEASES_DIR}/CLI_INSTALL.md"

      - name: Atomically promote latest.json
        if: env.IS_STABLE == 'true'
        run: |
          set -euo pipefail
          install -m 0644 "${RUNNER_TEMP}/release.json" "${RELEASES_DIR}/latest.json.next"
          mv -f "${RELEASES_DIR}/latest.json.next" "${RELEASES_DIR}/latest.json"
          echo "Promoted ${TAG_NAME} to latest.json"

  # Fallback publish target alongside cdn.leagent.me/computer (unchanged by
  # this job): the Aliyun host serving that domain sits behind a network path
  # that silently blocks curl-class HTTP clients for reasons still under
  # investigation (#prj-daemon, 2026-07-30) — real browsers are unaffected,
  # but that's exactly the client our own install.sh/CLI update path uses.
  # OSS's own bucket domain doesn't require mainland China ICP filing and
  # doesn't sit behind that path, so it's a distribution point a stuck
  # machine can be pointed at via MULTICA_RELEASE_MANIFEST_BASE_URL /
  # --release-manifest-base-url (#1526) without waiting on that
  # investigation to resolve. This job never touches the Aliyun host or the
  # existing publish-downloads-feed job's output; a plain hosted runner is
  # enough since it never writes to `/data/multica`.
  #
  # Aliyun OSS compatibility gotchas: see the canonical list at the top of
  # the "S3 / CloudFront" section in .env.example (bucket must pre-exist /
  # addressing style / checksum trailers) before changing anything below —
  # this job and migrate-uploads-to-s3 have each independently hit all
  # three; don't make it a fourth rediscovery.
  publish-downloads-feed-oss:
    needs: [verify, release]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ needs.verify.outputs.tag_name }}
      IS_STABLE: ${{ needs.verify.outputs.is_stable }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_OSS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_OSS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: oss-cn-beijing
      # AWS SDK v2's default PutObject checksum encoding
      # (STREAMING-UNSIGNED-PAYLOAD-TRAILER) isn't supported by Aliyun OSS's
      # S3-compatible layer ("NotImplemented"). Same fix already documented
      # for the app's own S3-compatible attachment storage (.env.example).
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      OSS_ENDPOINT_URL: https://oss-cn-beijing.aliyuncs.com
      OSS_BUCKET: lrm-2-0-release
      # Public HTTPS base objects are readable at. Not a secret (it's the
      # bucket's own public domain) — kept as one literal here, not derived,
      # since bucket-domain construction rules vary by provider/CDN and a
      # mismatch would silently break every install/update pointed at it.
      OSS_PUBLIC_BASE_URL: https://lrm-2-0-release.oss-cn-beijing.aliyuncs.com/releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS CLI defaults to path-style addressing (endpoint/bucket/key)
      # against a bare regional --endpoint-url. Aliyun OSS's S3-compatible
      # API rejects that for this bucket ("SecondLevelDomainForbidden:
      # Please use virtual hosted style to access") and requires
      # bucket.endpoint/key instead — force it globally for this job rather
      # than fighting per-command flags.
      - name: Configure AWS CLI for OSS virtual-hosted-style addressing
        run: aws configure set default.s3.addressing_style virtual

      - name: Download release archives + checksums from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-assets"
          release_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME}")"
          echo "$release_json" |
            jq -c '.assets[] | select(.name == "checksums.txt" or (.name | test("^multica-cli-.*\\.(tar\\.gz|zip)$")))' |
            while IFS= read -r asset; do
              name="$(jq -r '.name' <<<"$asset")"
              url="$(jq -r '.url' <<<"$asset")"
              echo "Downloading ${name}"
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                -o "${RUNNER_TEMP}/release-assets/${name}" \
                "$url"
            done
          test -f "${RUNNER_TEMP}/release-assets/checksums.txt"
          ls -la "${RUNNER_TEMP}/release-assets"

      - name: Build release manifest (OSS base URL)
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          bash scripts/publish-release-manifest.sh \
            "${TAG_NAME}" "${version}" \
            "${OSS_PUBLIC_BASE_URL}/${TAG_NAME}" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" \
            "${RUNNER_TEMP}/release-assets" \
            >"${RUNNER_TEMP}/release-oss.json"
          cat "${RUNNER_TEMP}/release-oss.json"

      - name: Publish immutable per-version objects
        run: |
          set -euo pipefail
          prefix="releases/${TAG_NAME}"
          # A single object PUT is atomic; refuse to silently overwrite an
          # already-published immutable version (mirrors the local-disk
          # job's own directory-exists guard).
          if aws s3api head-object \
            --endpoint-url "$OSS_ENDPOINT_URL" --bucket "$OSS_BUCKET" --key "${prefix}/release.json" \
            >/dev/null 2>&1; then
            echo "::error title=Immutable release object already exists::s3://${OSS_BUCKET}/${prefix}/release.json"
            exit 1
          fi
          shopt -s nullglob
          for f in "${RUNNER_TEMP}/release-assets"/multica-cli-*.tar.gz "${RUNNER_TEMP}/release-assets"/multica-cli-*.zip; do
            aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" "$f" "s3://${OSS_BUCKET}/${prefix}/$(basename "$f")"
          done
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" "s3://${OSS_BUCKET}/${prefix}/checksums.txt"
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" \
            "${RUNNER_TEMP}/release-oss.json" "s3://${OSS_BUCKET}/${prefix}/release.json"
          echo "Published immutable release objects: s3://${OSS_BUCKET}/${prefix}/"

      - name: Publish install scripts + docs (stable path, not per-version)
        run: |
          set -euo pipefail
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" scripts/install.sh "s3://${OSS_BUCKET}/releases/install.sh"
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" scripts/install.ps1 "s3://${OSS_BUCKET}/releases/install.ps1"
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" CLI_INSTALL.md "s3://${OSS_BUCKET}/releases/CLI_INSTALL.md"

      - name: Promote latest.json
        if: env.IS_STABLE == 'true'
        run: |
          set -euo pipefail
          aws s3 cp --endpoint-url "$OSS_ENDPOINT_URL" "${RUNNER_TEMP}/release-oss.json" "s3://${OSS_BUCKET}/releases/latest.json"
          echo "Promoted ${TAG_NAME} to s3://${OSS_BUCKET}/releases/latest.json"

      # "Upload succeeded" is not "installable" — task #187 was exactly this
      # shape (update request 200, nothing actually changed) and #15's s144
      # incident was a silent-404 variant of the same failure. Prove the
      # published bytes are the same bytes a real install/update would fetch
      # over HTTPS, not just that the OSS API accepted the PUT.
      - name: Verify the published feed is actually publicly downloadable
        run: |
          set -euo pipefail
          verify_matches() {
            local url="$1" want_file="$2" label="$3"
            local got_file
            got_file="$(mktemp)"
            curl -fsSL "$url" -o "$got_file"
            if ! cmp -s "$want_file" "$got_file"; then
              echo "::error title=Published object does not match uploaded content::${label} (${url})"
              exit 1
            fi
            rm -f "$got_file"
          }
          verify_matches "${OSS_PUBLIC_BASE_URL}/${TAG_NAME}/checksums.txt" \
            "${RUNNER_TEMP}/release-assets/checksums.txt" "checksums.txt"
          verify_matches "${OSS_PUBLIC_BASE_URL}/${TAG_NAME}/release.json" \
            "${RUNNER_TEMP}/release-oss.json" "release.json"
          if [ "$IS_STABLE" = "true" ]; then
            verify_matches "${OSS_PUBLIC_BASE_URL}/latest.json" \
              "${RUNNER_TEMP}/release-oss.json" "latest.json"
          fi
          echo "Verified: published objects are byte-identical when re-downloaded over HTTPS from the public OSS feed."

  # The web-only release policy publishes Linux amd64 images only. The served
  # deployment target is amd64. Daemon archives are handled by the release job
  # above for Linux amd64 and Wendy's Darwin arm64 host only.
  docker-backend-build:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    # One mutable cache head per image/platform; serialize tag releases so two
    # writers cannot overwrite the same registry cache concurrently.
    concurrency:
      group: release-docker-backend-cache-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-backend
          labels: |
            org.opencontainers.image.title=Multica Backend
            org.opencontainers.image.description=Multica self-hosted backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry caches are ref-independent. Prefer the release lane and
          # fall back to dev for the first release cache seed. GHCR is free
          # under GitHub's 2026-07 policy; re-evaluate if that policy changes.
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:buildcache-release-${{ env.PLATFORM_PAIR }}
            type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:buildcache-dev-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:buildcache-release-${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            VERSION=${{ needs.verify.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=ghcr.io/${{ env.GHCR_OWNER }}/multica-backend,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [verify, docker-backend-build]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.GHCR_OWNER }}/multica-backend@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ env.GHCR_OWNER }}/multica-backend:${{ steps.meta.outputs.version }}

  docker-web-build:
    needs: verify
    if: github.repository == 'LRM-Teams/multica'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    # One mutable cache head per image/platform; serialize tag releases so two
    # writers cannot overwrite the same registry cache concurrently.
    concurrency:
      group: release-docker-web-cache-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-web
          labels: |
            org.opencontainers.image.title=Multica Web
            org.opencontainers.image.description=Multica self-hosted web frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry caches are ref-independent. Prefer the release lane and
          # fall back to dev for the first release cache seed.
          cache-from: |
            type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-web:buildcache-release-${{ env.PLATFORM_PAIR }}
            type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-web:buildcache-dev-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/${{ env.GHCR_OWNER }}/multica-web:buildcache-release-${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.tag_name }}
          outputs: type=image,name=ghcr.io/${{ env.GHCR_OWNER }}/multica-web,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [verify, docker-web-build]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_OWNER }}/multica-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.GHCR_OWNER }}/multica-web@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ env.GHCR_OWNER }}/multica-web:${{ steps.meta.outputs.version }}

  helm-chart:
    needs: [verify, docker-backend-merge, docker-web-merge]
    if: github.repository == 'LRM-Teams/multica'
    runs-on: ubuntu-latest
    concurrency:
      group: release-helm-chart-${{ github.ref }}
      cancel-in-progress: true
    env:
      CHART_DIR: deploy/helm/multica
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Sync chart metadata with release tag
        env:
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          chart_version="${TAG_NAME#v}"
          sed -i -E "s/^version:.*/version: ${chart_version}/" "$CHART_DIR/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${TAG_NAME}\"/" "$CHART_DIR/Chart.yaml"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Configure OCI registry
        run: echo "OCI_REGISTRY=oci://ghcr.io/${GHCR_OWNER}/charts" >> "$GITHUB_ENV"

      - name: Push chart to GHCR
        run: helm push ".chart-packages/multica-${CHART_VERSION}.tgz" "$OCI_REGISTRY"

      - name: Verify published chart
        run: helm show chart "$OCI_REGISTRY/multica" --version "$CHART_VERSION"
