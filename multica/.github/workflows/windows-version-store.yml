name: Windows version-store check

# The 2026-08-01/02 incident: version_store.go's StageBinary executes the
# freshly-staged .exe to verify its version, then immediately renames its
# parent directory into place. Safe on Unix by construction (rename never
# cares about open handles); racy on Windows (image-lock release timing + AV
# on-close scanning can hold a transient lock on a just-executed .exe).
# CI has never run this package under real Windows semantics — ci.yml is
# ubuntu-latest only.
#
# Path-filtered rather than always-on or manual: a `paths:` trigger costs
# nothing on the overwhelming majority of PRs that never touch this code, but
# still runs automatically the day someone — including a future refactor by
# someone unaware of this history — touches it again, with no one needing to
# remember to click anything. See
# docs/superpowers/specs/2026-08-01-daemon-update-mechanism-design.md.
on:
  pull_request:
    branches: [dev]
    paths:
      - "server/internal/cli/version_store*.go"
      - "server/internal/cli/update.go"
      - "server/internal/cli/stage_release.go"
      - ".github/workflows/windows-version-store.yml"
  push:
    branches: [dev]
    paths:
      - "server/internal/cli/version_store*.go"
      - "server/internal/cli/update.go"
      - "server/internal/cli/stage_release.go"
      - ".github/workflows/windows-version-store.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: server/go.sum

      - name: Test server/internal/cli (real Windows semantics)
        # No -run filter: the `paths:` trigger above already scopes when this
        # job runs at all, so a test-name filter here only risks silently
        # excluding tests whose names don't happen to match (caught in
        # review, 2026-08-02: TestRenamePublishWithRetry_* never ran because
        # an earlier -run TestVersionStore didn't match their names).
        run: cd server; go test ./internal/cli/... -v -count=1
