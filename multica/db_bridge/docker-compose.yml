# Local single-host deployment for Cube sandbox LLM capture.
#
#   db_bridge_stub     le-agent side: receives /chat/completions, writes to Supabase
#   gateway-executor   areal side:    claims rows, forwards to the real LLM gateway
#
# Usage:
#   cp .env.docker.example .env.docker   # fill in Supabase credentials
#   docker compose --env-file .env.docker up -d --build
#   curl http://127.0.0.1:9100/healthz
#
# Pi / Cube sandbox AREAL_BASE_URL:
#   Docker network caller:  http://db_bridge_stub:9100/v1
#   Cube tap-network caller: http://<host-ip>:9100/v1   (db_bridge_stub won't resolve)

services:
  db_bridge_stub:
    build: .
    image: db-bridge:local
    container_name: db_bridge_gateway_stub
    command: ["python", "-m", "db_bridge.run_stub", "--side", "multica"]
    env_file:
      - path: .env.docker
        required: true
    environment:
      BRIDGE_STUB_HOST: "0.0.0.0"
      BRIDGE_GATEWAY_STUB_PORT: "9100"
    # Host network is required for Cube tap sandboxes: allowOut traffic is
    # SNATed to the host LAN IP and hairpins on the uplink. Docker's published
    # port (docker-proxy + DOCKER DNAT) breaks that hairpin (SYN-ACK RST), so
    # the stub must listen on the host itself — same pattern as :80 on this node.
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway-mock:
    build: .
    image: db-bridge:local
    container_name: db_bridge_gateway_mock
    command: ["python", "scripts/dev_areal_gateway.py"]
    environment:
      BRIDGE_DEV_GATEWAY_HOST: "127.0.0.1"
      BRIDGE_DEV_GATEWAY_PORT: "18080"
    # Host network so gateway-executor (also host) can reach 127.0.0.1:18080.
    network_mode: host
    restart: unless-stopped

  gateway-executor:
    build: .
    image: db-bridge:local
    container_name: db_bridge_gateway_executor
    command: ["python", "-m", "db_bridge.run_executor", "--side", "areal"]
    env_file:
      - path: .env.docker
        required: true
    # Host network lets the executor reach a gateway bound to 127.0.0.1 / 192.168.0.1
    # on the machine without extra NAT or proxy hops.
    network_mode: host
    restart: unless-stopped
    depends_on:
      db_bridge_stub:
        condition: service_started
      gateway-mock:
        condition: service_started

  # Uncomment for a full two-way bridge (AReaL -> le-agent API).
  #
  # areal-stub:
  #   image: db-bridge:local
  #   container_name: db_bridge_areal_stub
  #   command: ["python", "-m", "db_bridge.run_stub", "--side", "areal"]
  #   env_file:
