# s89 is fronted by the repository-managed Caddy service. Keep the application
# frontend private to the Compose network so Caddy resolves `frontend:3000`
# directly and this deployment cannot collide with another workload's host
# port. Caddy serves the existing HTTP :8090 entrypoint and trusted HTTPS on the
# public IP for browser microphone access.
#
# Local/self-host usage continues to use docker-compose.selfhost.yml alone and
# may publish FRONTEND_PORT for direct browser access.
services:
  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-${API_PORT:-${SERVER_PORT:-${PORT:-8080}}}}:8080"
    environment:
      FRONTEND_ORIGIN: https://82.157.184.89
      # Google rejects non-localhost raw-IP OAuth callbacks. The web client
      # derives its callback from window.location.origin, so the IP-only s89
      # entrypoint must keep Google login disabled.
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
      MULTICA_APP_URL: https://82.157.184.89
      MULTICA_PUBLIC_URL: https://82.157.184.89

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2.11.3@sha256:ec18ee54aab3315c22e25f3b2babda73ff8007d39b13b3bd1bfffa2f0444c7d9
    container_name: multica-caddy
    depends_on:
      - frontend
      - backend
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
      - "0.0.0.0:8090:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
