# Self-hosting Docker Compose — starts PostgreSQL, backend, and frontend.
#
# Services bind to 127.0.0.1 only. For cross-machine or public access, front
# them with a reverse proxy (Caddy / nginx / Cloudflare Tunnel) that terminates
# TLS and forwards to 127.0.0.1:8080 (backend) and 127.0.0.1:3000 (frontend).
# Do NOT change these bindings to 0.0.0.0 — Docker bypasses host firewalls
# (UFW/iptables) by default, so the raw ports would be exposed to the internet
# with the default JWT_SECRET and Postgres credentials. See:
#   apps/docs/content/docs/self-host-quickstart.mdx
#
# Usage:
#   cp .env.example .env
#   # Edit .env — change JWT_SECRET at minimum
#   docker compose -f docker-compose.selfhost.yml up -d
#
# Frontend: http://localhost:${FRONTEND_PORT:-3000}
# Backend:  http://localhost:${BACKEND_PORT:-${API_PORT:-${SERVER_PORT:-${PORT:-8080}}}}

name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/lrm-teams/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:${BACKEND_PORT:-${API_PORT:-${SERVER_PORT:-${PORT:-8080}}}}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      # Default loopback scrape + in-process p95 SLO alerter. Set
      # METRICS_DISABLED=1 to opt out. Optional HTTP_SLO_ALERT_WEBHOOK_URL
      # receives JSON firing/resolved payloads when served p95 > 1s.
      METRICS_ADDR: ${METRICS_ADDR:-127.0.0.1:9091}
      METRICS_DISABLED: ${METRICS_DISABLED:-}
      HTTP_SLO_ALERT_WEBHOOK_URL: ${HTTP_SLO_ALERT_WEBHOOK_URL:-}
      # Optional override for the daemon release-manifest base URL dispatched at
      # heartbeat (task #815 step 2). Empty means daemons fall back to their own
      # compiled-in default; set this only to redirect all daemons to a new
      # mirror without reinstalling every machine.
      MULTICA_SERVER_RELEASE_MANIFEST_BASE_URL: ${MULTICA_SERVER_RELEASE_MANIFEST_BASE_URL:-}

      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:${FRONTEND_PORT:-3000}/auth/callback}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AWS_REQUEST_CHECKSUM_CALCULATION: ${AWS_REQUEST_CHECKSUM_CALCULATION:-}
      AWS_RESPONSE_CHECKSUM_VALIDATION: ${AWS_RESPONSE_CHECKSUM_VALIDATION:-}
      ATTACHMENT_DOWNLOAD_MODE: ${ATTACHMENT_DOWNLOAD_MODE:-auto}
      ATTACHMENT_DOWNLOAD_URL_TTL: ${ATTACHMENT_DOWNLOAD_URL_TTL:-30m}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_ENV: ${APP_ENV:-production}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      MULTICA_DEV_AGENT_PROFILE_ACCESS: ${MULTICA_DEV_AGENT_PROFILE_ACCESS:-false}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Public URL the API is reachable at from the open internet, no
      # trailing slash. Used to mint absolute webhook URLs for autopilot
      # webhook triggers. Leave unset behind a same-origin reverse proxy
      # (e.g. plain localhost dev); the frontend will compose the URL
      # from window.origin + webhook_path in that case. Headers are
      # intentionally NOT used to derive this value, to avoid Host /
      # X-Forwarded-Host spoofing on misconfigured proxies.
      MULTICA_PUBLIC_URL: ${MULTICA_PUBLIC_URL:-}
      # Comma-separated CIDRs whose source IP is allowed to set
      # X-Forwarded-For / X-Real-IP for the webhook per-IP rate limiter.
      # Empty default = headers ignored, RemoteAddr used. Set e.g.
      # "127.0.0.1/32" when running behind a same-host reverse proxy.
      MULTICA_TRUSTED_PROXIES: ${MULTICA_TRUSTED_PROXIES:-}
      # Lark / Feishu bot integration. MULTICA_LARK_SECRET_KEY is the
      # opt-in: unset = integration disabled. Mainland 飞书 and international
      # Lark are auto-detected per installation and served side by side, so
      # the two base-URL knobs should normally stay EMPTY. They are optional
      # deployment-wide overrides that force every installation onto one host
      # (proxy / mock / single-cloud staging). Upgrading from a setup that
      # used https://open.larksuite.com here? The server relabels existing
      # installs to region=lark on first boot, then you can clear them.
      # See docs/lark-bot-integration.
      MULTICA_LARK_SECRET_KEY: ${MULTICA_LARK_SECRET_KEY:-}
      MULTICA_LARK_HTTP_BASE_URL: ${MULTICA_LARK_HTTP_BASE_URL:-}
      MULTICA_LARK_CALLBACK_BASE_URL: ${MULTICA_LARK_CALLBACK_BASE_URL:-}
      # Doubao Speech ASR 2.0 + TTS 2.0. The API key is server-only and the
      # endpoints stay disabled when it is empty.
      DOUBAO_SPEECH_API_KEY: ${DOUBAO_SPEECH_API_KEY:-}
      DOUBAO_DIALOG_API_KEY: ${DOUBAO_DIALOG_API_KEY:-}
      DOUBAO_TTS_SPEAKER_ID: ${DOUBAO_TTS_SPEAKER_ID:-zh_male_m191_uranus_bigtts}
      # Volcengine RTC conversational Agent. Any explicit credential, model,
      # or callback value opts in, and the backend rejects partial
      # configurations instead of starting calls with missing credentials.
      # The callback URL defaults to MULTICA_PUBLIC_URL +
      # /api/voice-calls/callback.
      VOLCENGINE_RTC_APP_ID: ${VOLCENGINE_RTC_APP_ID:-}
      VOLCENGINE_RTC_APP_KEY: ${VOLCENGINE_RTC_APP_KEY:-}
      VOLCENGINE_RTC_ACCESS_KEY_ID: ${VOLCENGINE_RTC_ACCESS_KEY_ID:-}
      VOLCENGINE_RTC_SECRET_ACCESS_KEY: ${VOLCENGINE_RTC_SECRET_ACCESS_KEY:-}
      VOLCENGINE_RTC_SESSION_TOKEN: ${VOLCENGINE_RTC_SESSION_TOKEN:-}
      VOLCENGINE_RTC_ENDPOINT: ${VOLCENGINE_RTC_ENDPOINT:-}
      VOLCENGINE_RTC_REGION: ${VOLCENGINE_RTC_REGION:-}
      VOLCENGINE_RTC_API_VERSION: ${VOLCENGINE_RTC_API_VERSION:-}
      VOLCENGINE_RTC_ARK_ENDPOINT_ID: ${VOLCENGINE_RTC_ARK_ENDPOINT_ID:-}
      VOLCENGINE_RTC_ASR_APP_ID: ${VOLCENGINE_RTC_ASR_APP_ID:-}
      VOLCENGINE_RTC_TTS_APP_ID: ${VOLCENGINE_RTC_TTS_APP_ID:-}
      VOLCENGINE_RTC_SPEECH_ACCESS_TOKEN: ${VOLCENGINE_RTC_SPEECH_ACCESS_TOKEN:-}
      VOLCENGINE_RTC_TTS_VOICE_ID: ${VOLCENGINE_RTC_TTS_VOICE_ID:-}
      VOLCENGINE_RTC_CALLBACK_URL: ${VOLCENGINE_RTC_CALLBACK_URL:-}
      VOLCENGINE_RTC_CALLBACK_SIGNATURE: ${VOLCENGINE_RTC_CALLBACK_SIGNATURE:-}
      VOLCENGINE_RTC_TOKEN_TTL: ${VOLCENGINE_RTC_TOKEN_TTL:-30m}
      VOLCENGINE_RTC_COMPENSATION_TIMEOUT: ${VOLCENGINE_RTC_COMPENSATION_TIMEOUT:-10s}
      VOLCENGINE_RTC_CLEANUP_TIMEOUT: ${VOLCENGINE_RTC_CLEANUP_TIMEOUT:-10s}
      # Point multica's arealrl client (server/internal/arealrl/client.go) at
      # the multica-side gateway stub (db-bridge-stub-multica), which serves
      # /rl/* and /chat/completions and relays them through the shared Supabase
      # DB to the AReaL gateway. Only read by RL training/interaction flows;
      # override in /data/multica/.env if the stub runs elsewhere.
      AREAL_BRIDGE_STUB_URL: ${AREAL_BRIDGE_STUB_URL:-http://db-bridge-stub-multica:${BRIDGE_GATEWAY_STUB_PORT:-9100}}
      # Admin key the backend's arealrl client sends to the AReaL gateway when it
      # opens/close/reward RL sessions and exports trajectories
      # (service/training_config.go: AREAL_ADMIN_API_KEY authenticates
      # start_session). LoadTrainingConfig treats training as UNCONFIGURED when
      # this is empty — even if AREAL_BRIDGE_STUB_URL is set — so env-dispatch
      # training returns "bridge not configured" (500). Must MATCH the real
      # AReaL gateway's admin key in production; the simulation gateway ignores
      # it, so any non-empty value works for a sim bring-up. Override in
      # /data/multica/.env.
      AREAL_ADMIN_API_KEY: ${AREAL_ADMIN_API_KEY:-areal-admin-5058bdacf2a9ae2ea4d00ada0de399ff2516af047f8d117f}
      # AReaL LLM proxy base_url injected into env-dispatch training sandboxes
      # (service/training_config.go: AREAL_PROXY_URL). Must be reachable from
      # inside the sandbox: typically the db_bridge chat_completions stub
      # running on the sandbox host (BRIDGE_GATEWAY_STUB_PORT). Empty disables
      # the override and falls back to the in-code default http://db_bridge_stub:9100/v1.
      AREAL_PROXY_URL: ${AREAL_PROXY_URL:-http://10.110.158.143:9100/v1}
    restart: unless-stopped

  frontend:
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/lrm-teams/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"  
    environment:
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped

  # multica-side gateway stub: serves /rl/start_session, /rl/set_reward,
  # /rl/end_session, /rl/close_segment, and /chat/completions for Multica's
  # own arealrl client (the Multica -> AReaL direction). The backend is pointed
  # at this stub via AREAL_BRIDGE_STUB_URL (see backend env above); the stub
  # enqueues each call into rpc_rl_* / rpc_chat_completions, and the AReaL-side
  # executor (--side areal) forwards it to the real AReaL gateway. AReaL calls
  # Multica directly, so no Multica-side executor is required.
  #
  # BRIDGE_USER_ID MUST equal the AReaL-side executor's BRIDGE_USER_ID - the
  # rows this stub enqueues are claimed on the AReaL host under that user, so a
  # mismatch leaves them unclaimed (multica -> AReaL calls hang until 504). It
  # defaults to the same UUID as MULTICA_BRIDGE_USER_ID so all multica-side
  # bridge traffic shares one isolation user; override in /data/multica/.env.
  # The arealrl client sends no X-Bridge-User-Id header, so this MUST be a
  # valid UUID or the stub rejects every request with 400.
  db-bridge-stub-multica:
    profiles: ["db-bridge"]
    image: ${MULTICA_DB_BRIDGE_IMAGE:-ghcr.io/lrm-teams/multica-db-bridge}:${MULTICA_IMAGE_TAG:-latest}
    command: ["python", "-m", "db_bridge.run_stub", "--side", "multica"]
    ports:
      - "127.0.0.1:${BRIDGE_GATEWAY_STUB_PORT:-9100}:${BRIDGE_GATEWAY_STUB_PORT:-9100}"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      BRIDGE_USER_ID: ${BRIDGE_USER_ID:-c88b46a8-a8b5-4414-82fb-91398bd063b4}
      # Bind 0.0.0.0 in-container so the backend container can reach the stub
      # over the compose network (db-bridge-stub-multica:9100). The host port
      # still maps to 127.0.0.1 only - the stub is not exposed to the internet.
      BRIDGE_STUB_HOST: ${BRIDGE_STUB_HOST:-0.0.0.0}
      BRIDGE_GATEWAY_STUB_PORT: ${BRIDGE_GATEWAY_STUB_PORT:-9100}
      BRIDGE_POLL_INTERVAL: ${BRIDGE_POLL_INTERVAL:-1}
      BRIDGE_MAX_BODY_BYTES: ${BRIDGE_MAX_BODY_BYTES:-67108864}
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:
