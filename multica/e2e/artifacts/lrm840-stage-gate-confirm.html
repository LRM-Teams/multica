<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>LRM-840 Gate Shots — stage gate 人工确认控件</title>
    <style>
      :root {
        --fg: #18181b;
        --muted: #71717a;
        --border: rgba(24, 24, 27, 0.12);
        --bg: #fafafa;
        --card: #fff;
        --brand: #2563eb;
        --warning: #d97706;
        --warning-bg: rgba(217, 119, 6, 0.1);
        --warning-border: rgba(217, 119, 6, 0.35);
        --destructive: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      .shell { min-height: 100vh; display: flex; flex-direction: column; }
      .chrome {
        border-bottom: 1px solid var(--border);
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(8px);
      }
      .identity {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 16px 4px;
      }
      .identity h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        border: 1px solid var(--warning-border);
        background: var(--warning-bg);
        color: var(--warning);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .pill .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--warning); }
      .toolbar {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 4px 16px 10px;
      }
      .context { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
      .chip {
        flex-shrink: 0;
        border: 1px solid rgba(24,24,27,0.14);
        background: rgba(24,24,27,0.04);
        border-radius: 6px;
        padding: 2px 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .goal { margin: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
      button {
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 600;
        min-height: 32px;
        cursor: pointer;
      }
      button.primary {
        background: var(--brand); color: #fff; border: none;
      }
      button.outline {
        background: #fff; color: var(--fg); border: 1px solid var(--border);
      }
      button.destructive {
        background: var(--destructive); color: #fff; border: none; width: 100%;
      }
      .canvas {
        flex: 1;
        margin: 16px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        background: var(--card);
        min-height: 220px;
        display: flex; align-items: center; justify-content: center;
        color: var(--muted); font-size: 13px;
      }
      .toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
        background: #111; color: #fff; font-size: 13px; font-weight: 600;
        padding: 10px 14px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        display: none; z-index: 3; white-space: nowrap;
      }
      .popover {
        position: absolute; right: 16px; top: 88px;
        width: min(20rem, calc(100vw - 2rem));
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        display: none;
        z-index: 2;
        gap: 10px;
      }
      .popover.open { display: flex; flex-direction: column; }
      .popover h2 { margin: 0; font-size: 14px; }
      .popover p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
      textarea {
        width: 100%;
        min-height: 4.5rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
        resize: vertical;
      }
      .label {
        position: fixed; top: 8px; right: 8px;
        background: #111; color: #fff; font-size: 11px;
        padding: 4px 8px; border-radius: 6px; opacity: 0.75; z-index: 4;
      }
      .pill.running {
        border-color: rgba(37,99,235,0.3);
        background: rgba(37,99,235,0.1);
        color: var(--brand);
      }
      .pill.running .dot { background: var(--brand); }
      .pill.completed {
        border-color: rgba(22,163,74,0.35);
        background: rgba(22,163,74,0.1);
        color: #16a34a;
      }
      .pill.completed .dot { background: #16a34a; }
      @media (max-width: 480px) {
        .goal { display: none; }
        .toolbar { align-items: flex-start; }
        .actions { flex-wrap: wrap; justify-content: flex-end; }
      }
    </style>
  </head>
  <body>
    <div class="label" id="shot-label">desktop · approve</div>
    <div class="shell" data-testid="research-session-page">
      <header class="chrome" data-testid="research-session-chrome">
        <div class="identity" data-testid="research-session-identity">
          <h1>向量库成本调研</h1>
          <span class="pill" id="status-pill" data-testid="research-session-status">
            <span class="dot"></span><span id="status-text">待确认</span>
          </span>
        </div>
        <div class="toolbar" data-testid="research-session-toolbar">
          <div class="context">
            <span class="chip">S4 · 交付</span>
            <p class="goal">对比托管向量库成本与召回质量，给出选型建议</p>
          </div>
          <div class="actions" data-testid="research-session-actions" id="actions">
            <button type="button" class="primary" data-testid="research-session-primary" data-gate-action="approve" id="approve-btn">批准</button>
            <button type="button" class="outline" data-testid="research-session-gate-reject" data-gate-action="reject" id="reject-btn">驳回</button>
          </div>
        </div>
      </header>
      <div
        class="popover"
        id="reject-popover"
        data-testid="research-session-gate-reject-popover"
      >
        <h2>驳回确认</h2>
        <p>可填意见回传调研主理人，舰队将据此修订。</p>
        <textarea
          id="reject-reason"
          data-testid="research-session-gate-reject-reason"
          placeholder="希望舰队修订什么？"
        ></textarea>
        <button type="button" class="destructive" data-testid="research-session-gate-reject-submit" id="reject-submit">发送驳回</button>
      </div>
      <div class="canvas">画布保持可交互 · 等待确认期间状态可见不卡死</div>
      <div class="toast" id="toast" data-testid="research-gate-toast"></div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const shot = params.get("shot") || "approve";
      const label = document.getElementById("shot-label");
      const pill = document.getElementById("status-pill");
      const statusText = document.getElementById("status-text");
      const popover = document.getElementById("reject-popover");
      const reason = document.getElementById("reject-reason");
      const toast = document.getElementById("toast");
      const actions = document.getElementById("actions");
      const narrow = shot.startsWith("narrow");

      function showToast(text) {
        toast.textContent = text;
        toast.style.display = "block";
      }

      if (shot === "approve" || shot === "narrow-approve") {
        label.textContent = (narrow ? "narrow" : "desktop") + " · approve";
      } else if (shot === "reject" || shot === "narrow-reject") {
        label.textContent = (narrow ? "narrow" : "desktop") + " · reject";
        popover.classList.add("open");
        reason.value = "来源权重不够，请补齐权威基线后再提确认。";
      } else if (shot === "approved" || shot === "narrow-approved") {
        label.textContent = (narrow ? "narrow" : "desktop") + " · approved";
        statusText.textContent = "已完成";
        pill.className = "pill completed";
        actions.innerHTML = '<button type="button" class="primary">交付移交</button>';
        showToast("已批准确认");
      } else if (shot === "rejected" || shot === "narrow-rejected") {
        label.textContent = (narrow ? "narrow" : "desktop") + " · rejected";
        statusText.textContent = "进行中";
        pill.className = "pill running";
        actions.innerHTML = "";
        showToast("已驳回并回传舰队");
      }
    </script>
  </body>
</html>
