version: "2"
# Binary version is pinned in .sqlc-version (enforced by `make sqlc`).
# The committed pkg/db/generated/** must stay reproducible by bare
# `sqlc generate` at that exact version (LRM-1521): a regen diff that touches
# unrelated files signals drift, not a feature.
sql:
  - engine: "postgresql"
    queries: "pkg/db/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "pkg/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
